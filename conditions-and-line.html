<header><div class="brand"><span class="mark" aria-hidden="true">╱</span><h1>条件から直線</h1></div><button id="settingsToggle" class="quiet" aria-expanded="false" aria-controls="settings">設定 ≫</button></header>

<a class="home-link" href="./index.html">教材一覧へ</a></main><script>'use strict';
const $=s=>document.querySelector(s);
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function rat(n,d=1){if(!d)throw Error('分母は０にできません。');if(d<0){n=-n;d=-d}const g=gcd(n,d);return {n:n/g,d:d/g}}
const add=(a,b)=>rat(a.n*b.d+b.n*a.d,a.d*b.d);
const sub=(a,b)=>rat(a.n*b.d-b.n*a.d,a.d*b.d);
const mul=(a,b)=>rat(a.n*b.n,a.d*b.d);
const div=(a,b)=>rat(a.n*b.d,a.d*b.n);
const eq=(a,b)=>a.n===b.n&&a.d===b.d;
const num=a=>a.n/a.d;
const str=a=>a.d===1?String(a.n):`${a.n}/${a.d}`;
function parse(s){s=String(s).trim().replace(/−/g,'-');if(!/^-?\d{1,4}(\/\d{1,4})?$/.test(s))throw Error('整数、または「1/2」の形で入力しよう。');const[n,d=1]=s.split('/').map(Number);return rat(n,d)}
function frac(a){const sign=a.n<0?'−':'';return sign+(a.d===1?Math.abs(a.n):`<span class="frac"><span>${Math.abs(a.n)}</span><span>${a.d}</span></span>`)}
function formula(a,b){return `<i>y</i> = ${Math.abs(a.n)===a.d?(a.n<0?'−':''):frac(a)}<i>x</i>${b.n?` ${b.n<0?'−':'+'} ${frac(rat(Math.abs(b.n),b.d))}`:''}`}
function makePool(level){const map=new Map();for(let d=1;d<=4;d++)for(let n=-5;n<=5;n++){if(!n||gcd(n,d)!==1)continue;const a=rat(n,d);for(let x0=-3;x0<=3;x0++)for(let y0=-4;y0<=4;y0++){const b=sub(rat(y0),mul(a,rat(x0)));if(Math.abs(num(b))>5)continue;if(level==='integer'&&(a.d!==1||b.d!==1))continue;if(level==='fraction'&&a.d===1&&b.d===1)continue;const pts=[];for(let x=-5;x<=5;x++){const y=add(mul(a,rat(x)),b);if(y.d===1&&Math.abs(y.n)<=5)pts.push([rat(x),y])}if(pts.length<2)continue;map.set(str(a)+','+str(b),{a,b,pts})}}return [...map.values()]}
const pools={integer:makePool('integer'),fraction:makePool('fraction')};
const state={mode:'pointSlope',level:'integer',showGiven:false,q:null,count:0,phase:'graph',points:[null,null],values:{},active:null,targetPoint:1,coefficients:null,solved:false,hintTopic:null,hintStage:0};
function samePoint(p,q){return eq(p[0],q[0])&&eq(p[1],q[1])}
function onLine(p,q=state.q){return eq(p[1],add(mul(q.a,p[0]),q.b))}
function chooseQuestion(){
 let pool=pools[state.level];
 if(state.count%5===4)pool=pool.filter(q=>!q.b.n);
 const different=pool.filter(q=>!state.q||!eq(q.a,state.q.a)||!eq(q.b,state.q.b));if(different.length)pool=different;
 const q=pool[Math.floor(Math.random()*pool.length)];
 // Avoid giving away the intercept as the starting point when possible.
 const candidates=q.pts.filter(p=>p[0].n!==0),given=(candidates.length?candidates:q.pts)[Math.floor(Math.random()*(candidates.length||q.pts.length))];
 const other=q.pts.filter(p=>!samePoint(p,given));
 const target=other[Math.floor(Math.random()*other.length)];

document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideHint();settings(false);closeKeyboard();drawGraph();return}if(!state.active)return;if(/^\d$/.test(e.key)||['-','/','Backspace','Delete','Enter'].includes(e.key)){e.preventDefault();if(e.key==='Enter')commit(state.active.startsWith('p')?state.active[1]:'ab');else edit(e.key==='-'?'minus':e.key==='/'?'fraction':e.key==='Backspace'?'back':e.key==='Delete'?'clear':e.key)}});
newQuestion();
let layoutFrame=0;
function fitLayout(){cancelAnimationFrame(layoutFrame);layoutFrame=requestAnimationFrame(()=>{alignEquation();const app=$('#app'),graph=$('.graph-box'),a=app.getBoundingClientRect(),g=graph.getBoundingClientRect();app.style.setProperty('--hint-space',Math.max(60,g.top-a.top-10)+'px');const available=(window.visualViewport?.height||innerHeight)-Math.max(0,a.top+scrollY)-(a.height-g.height)-6,height=Math.max(140,Math.min(g.width*300/310,available));if(Math.abs(g.height-height)>.5)graph.style.height=height+'px'})}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitLayout).observe($('#app'));window.addEventListener('resize',fitLayout);window.visualViewport?.addEventListener('resize',fitLayout);fitLayout();
if(document.modelContext?.registerTool){try{const lifecycle=new AbortController();Promise.resolve(document.modelContext.registerTool({name:'start_conditions_question',title:'条件から直線の問題を始める',description:'種類と難易度を指定して新しい問題を始めます。現在の解答は消えます。',inputSchema:{type:'object',properties:{mode:{type:'string',enum:['pointSlope','twoPoints']},level:{type:'string',enum:['integer','fraction']}},required:['mode','level'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||!['pointSlope','twoPoints'].includes(input.mode)||!['integer','fraction'].includes(input.level))throw Error('Invalid input');setMode(input.mode,false);setLevel(input.level,false);newQuestion();return{mode:state.mode,level:state.level,phase:state.phase,question:state.count}}},{signal:lifecycle.signal})).catch(()=>{});window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true})}catch{}}
</script></body></html>
