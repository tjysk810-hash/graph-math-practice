<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f6fc"><title>座標になれよう</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#182744;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;border:0;border-radius:9px;color:inherit;min-height:42px}button:focus-visible,input:focus-visible{outline:3px solid #eab52c}button:disabled{opacity:.5}[hidden]{display:none!important}main{max-width:470px;margin:auto;padding:10px 12px}header{display:flex;align-items:center;justify-content:space-between;height:38px}h1{font-size:19px;margin:0}.quiet{background:transparent;color:#2c52cc;font-size:13px}.modes{display:flex;background:#e3eaf6;border-radius:10px;padding:3px;margin:5px 0}.modes button{flex:1;background:transparent;font-size:14px;min-height:34px}.modes [aria-pressed=true]{background:white;color:#2c52cc;font-weight:700}.question{font-size:13px;min-height:33px;display:flex;align-items:center;gap:8px}.question b{color:#2c52cc}#plot{position:relative;margin:0 -12px;background:white;border-block:1px solid #dbe2ef;height:min(94vw,410px)}svg{width:100%;height:100%;display:block;touch-action:manipulation}#hintButton{position:absolute;top:5px;left:6px;border:1px solid #dbe2ef;border-radius:50%;width:32px;min-height:32px;background:#eef3ff;color:#2c52cc;font-size:20px}#problem{background:#eaf0ff;margin:0 -12px 12px;padding:9px 15px;display:flex;align-items:center;justify-content:space-between;min-height:58px}#problem small{color:#59677e}#coordinate{font-size:26px;font-family:Georgia,serif}#refresh{min-height:28px;padding:2px 8px;border:1px solid #cbd5e8;background:white;color:#2c52cc;font-size:12px}.meta{display:flex;flex-direction:column;gap:4px}.answer{display:flex;gap:7px;align-items:center}.answer span{font-size:23px}.answer input{min-width:0;width:100%;height:44px;border:1px solid #cbd5e8;border-radius:9px;text-align:center;background:white;color:#182744;font-size:19px}.answer input.active{border:2px solid #2c52cc}.minus{flex:0 0 35px;background:#e6edf8;font-size:24px}.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:7px}.keypad button{background:white;border:1px solid #dbe2ef;font-size:21px;min-height:39px}.keypad button:last-child{font-size:12px}#feedback{min-height:47px;display:flex;align-items:center;font-size:14px;line-height:1.5;padding:6px 0;color:#59677e}#feedback.error{color:#ad302c}#feedback.success{color:#08767c;font-weight:bold}footer{display:flex;gap:8px}footer button{padding:8px 14px}#reset{background:white;border:1px solid #cbd5e8}#check,#next{flex:1;background:#2c52cc;color:white;font-weight:bold}.note{font-size:11px;color:#59677e;margin:10px 0}#hint{position:absolute;z-index:3;top:6px;left:10px;right:10px;background:white;border:1px solid #a7bcef;box-shadow:0 3px 15px #17305520;border-radius:12px;padding:8px 10px;max-height:110px;overflow:auto}main{position:relative}.hint-head{display:flex;align-items:center;gap:4px;font-size:13px}.hint-head b{margin-right:auto}.hint-head button{min-height:28px}#hintText{font-size:14px;line-height:1.5;margin:3px 0}#settings{position:absolute;top:48px;left:10px;right:10px;z-index:4;background:white;border:1px solid #cad5ea;border-radius:12px;padding:12px;box-shadow:0 5px 20px #17305520}#settings p{font-size:12px;line-height:1.7;color:#59677e}.options{display:flex;gap:5px}.options button{flex:1;background:#f3f6fc;font-size:13px}.options [aria-pressed=true]{background:#e1eaff;color:#2c52cc;border:1px solid #2c52cc}@media(max-height:700px){main{padding-top:4px}.note{display:none}#feedback{min-height:38px}}
</style></head><body><main id="app"><header><h1>座標になれよう</h1><button id="settingsButton" class="quiet" aria-expanded="false">設定 ≫</button></header><section id="settings" hidden><div class="hint-head"><b>出題する点</b><button id="closeSettings" class="quiet">閉じる</button></div><div class="options"><button data-set="all" aria-pressed="true">すべて</button><button data-set="axis" aria-pressed="false">軸上・原点</button></div><p>整数の座標を出題します。「すべて」には負の座標、軸上の点、原点も含まれます。設定を変えると新しい問題になります。</p></section><nav class="modes" aria-label="問題の種類"><button data-mode="plot" aria-pressed="true">点を打つ</button><button data-mode="read" aria-pressed="false">座標を読む</button></nav><div class="question"><b id="number">01</b><span id="instruction"></span></div><section id="plot" aria-label="座標平面"><svg id="graph" viewBox="0 0 340 340" role="group" aria-label="座標平面"></svg><button id="hintButton" aria-label="ヒントを表示" aria-expanded="false">?</button></section><section id="problem"><div class="meta"><small id="problemLabel"></small><button id="refresh">更新</button></div><div id="coordinate"></div></section><section id="answer" class="answer" aria-label="座標の入力" hidden><button id="minus" class="minus" aria-label="選択中の座標の符号を変える">−</button><span>(</span><input id="x" readonly inputmode="none" placeholder="x" aria-label="x座標"><span>,</span><input id="y" readonly inputmode="none" placeholder="y" aria-label="y座標"><span>)</span></section><section id="keypad" class="keypad" aria-label="数字入力" hidden></section><div id="feedback" role="status" aria-live="polite"></div><footer><button id="reset">やり直す</button><button id="check">答えを確かめる</button><button id="next" hidden>次の問題</button></footer><p class="note">横が x、縦が y。点を打ち直すときは、もう一度タップ。</p><aside id="hint" hidden><div class="hint-head"><b id="hintTitle"></b><button id="hintNext" class="quiet">次のヒント</button><button id="closeHint" class="quiet" aria-label="ヒントを閉じる">×</button></div><p id="hintText"></p></aside></main><script>'use strict';
const $=s=>document.querySelector(s),state={mode:'plot',set:'all',q:[0,0],selected:null,values:{x:'',y:''},active:null,solved:false,hint:0,count:0,bag:[]};
const categories=['pp','np','nn','pn','x','y','origin'];
function pickQuestion(){if(!state.bag.length)state.bag=(state.set==='axis'?['x','y','origin']:categories).map(v=>({v,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.v);const type=state.bag.pop(),n=()=>1+Math.floor(Math.random()*5),sign=()=>Math.random()<.5?-1:1;return type==='origin'?[0,0]:type==='x'?[n()*sign(),0]:type==='y'?[0,n()*sign()]:[n()*(type[0]==='p'?1:-1),n()*(type[1]==='p'?1:-1)]}
function message(t,c=''){$('#feedback').textContent=t;$('#feedback').className=c}
function closeInput(){state.active=null;$('#keypad').hidden=true;document.querySelectorAll('.answer input').forEach(e=>e.classList.remove('active'));fit()}
function hideHint(){state.hint=0;$('#hint').hidden=true;$('#hintButton').setAttribute('aria-expanded','false')}
function reset(){state.selected=null;state.values={x:'',y:''};state.solved=false;hideHint();closeInput();$('#x').value='';$('#y').value='';$('#x').disabled=false;$('#y').disabled=false;$('#minus').disabled=false;$('#check').hidden=false;$('#next').hidden=true;$('#answer').hidden=state.mode!=='read';$('#instruction').textContent=state.mode==='plot'?'この座標の点を打とう。':'点Pの座標を読み取ろう。';$('#problemLabel').textContent=state.mode==='plot'?'点Pの座標':'答えの座標';$('#coordinate').textContent=state.mode==='plot'?`P (${state.q.join(', ')})`:'P (x, y)';message(state.mode==='plot'?'グラフをタップして点Pを置こう。':'横の x、縦の y の順に入力しよう。');draw();fit()}
function newQuestion(){const old=state.q.join(',');let q=pickQuestion();if(q.join(',')===old)q=pickQuestion();state.q=q;state.count++;$('#number').textContent=String(state.count).padStart(2,'0');reset()}
const px=x=>170+26*x,py=y=>170-26*y;
function draw(){let out='';for(let i=-5;i<=5;i++){out+=`<path d="M${px(i)} 40V300 M40 ${py(i)}H300" stroke="#e2e9f3"/>`;if(i)out+=`<text x="${px(i)}" y="185" text-anchor="middle">${i}</text><text x="160" y="${py(i)+4}" text-anchor="end">${i}</text>`}out='<g fill="#65768f" font-size="11">'+out+'</g><path d="M30 170H324m-7-5 7 5-7 5 M170 310V20m-5 7 5-7 5 7" fill="none" stroke="#6c809e" stroke-width="1.5"/><text x="327" y="174" font-size="15">x</text><text x="178" y="24" font-size="15">y</text><text x="156" y="185" font-size="11">0</text>';
if(state.hint>=2){const[x,y]=state.q;out+=`<path d="M170 170H${px(x)}${state.hint>=3?'V'+py(y):''}" fill="none" stroke="#0d8580" stroke-width="3" stroke-dasharray="5 3"/>`;if(state.mode==='read')out+=`<path d="M${px(x)} ${py(y)}V170 ${state.hint>=3?'M'+px(x)+' '+py(y)+'H170':''}" fill="none" stroke="#0d8580" stroke-width="1.8" stroke-dasharray="5 3"/>`;if(state.hint>=3)out+=`<circle cx="${px(x)}" cy="${py(y)}" r="10" fill="none" stroke="#0d8580" stroke-width="2"/>`}
const point=state.mode==='read'?state.q:state.selected;if(point){out+=`<circle cx="${px(point[0])}" cy="${py(point[1])}" r="5" fill="${state.solved?'#08767c':'#2c52cc'}" stroke="white" stroke-width="2"/><text x="${px(point[0])+9}" y="${py(point[1])-9}" fill="#2c52cc" font-size="15" font-weight="bold">P</text>`}$('#graph').innerHTML=out}
function activate(id){if(state.solved)return;state.active=id;$('#keypad').hidden=false;document.querySelectorAll('.answer input').forEach(e=>e.classList.toggle('active',e.id===id));fit()}
function edit(key){if(state.solved)return;if(!state.active)activate('x');const id=state.active;let v=state.values[id];if(key==='minus')v=v.startsWith('-')?v.slice(1):'-'+v;else if(key==='back')v=v.slice(0,-1);else if(key==='clear')v='';else if(/^\d$/.test(key)&&v.replace('-','').length<2)v+=key;state.values[id]=v;$('#'+id).value=v;message('入力できたら「答えを確かめる」を押そう。')}
function check(){if(state.solved)return;closeInput();let answer=state.selected;if(state.mode==='read'){if(!['x','y'].every(id=>/^-?\d+$/.test(state.values[id]))){message('x と y の両方を整数で入力しよう。','error');return}answer=[Number(state.values.x),Number(state.values.y)]}if(!answer){message('まずグラフに点を打とう。','error');return}if(answer[0]!==state.q[0]||answer[1]!==state.q[1]){message(answer[0]===state.q[0]?'横の位置は合っています。縦の y を確認しよう。':answer[1]===state.q[1]?'縦の位置は合っています。横の x を確認しよう。':'横が x、縦が y。符号と順番を確かめよう。','error');return}state.solved=true;hideHint();$('#check').hidden=true;$('#next').hidden=false;$('#x').disabled=true;$('#y').disabled=true;$('#minus').disabled=true;$('#coordinate').textContent=`P (${state.q.join(', ')})`;message(state.q.every(v=>v===0)?'正解！ 原点の座標は (0, 0)。':'正解！ 横が x、縦が y。','success');draw();fit()}
function showHint(){state.hint=Math.min(3,state.hint+1);const[x,y]=state.q;$('#hint').hidden=false;$('#hintButton').setAttribute('aria-expanded','true');$('#hintTitle').textContent='ヒント '+state.hint+'/3';$('#hintNext').hidden=state.hint===3;$('#hintText').textContent=state.hint===1?'座標は (x, y)。原点から、まず横、次に縦を見よう。':state.hint===2?(state.mode==='read'?'点Pから真下・真上にたどり、x軸の目盛りを読もう。':x===0?'x は 0。横には動かず、y軸上を考えよう。':`まず原点から${x>0?'右':'左'}に ${Math.abs(x)}。`):(state.mode==='read'?'補助線の先の目盛りを、横の x、縦の y の順で読もう。':y===0?'y は 0。縦には動かず、x軸上に点を置こう。':`そこから${y>0?'上':'下'}に ${Math.abs(y)}。緑の丸が目印です。`);draw()}
$('#graph').onclick=e=>{if(state.mode!=='plot'||state.solved)return;const svg=$('#graph'),m=svg.getScreenCTM();if(!m)return;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const a=p.matrixTransform(m.inverse());if(a.x<30||a.x>310||a.y<30||a.y>310)return;state.selected=[Math.max(-5,Math.min(5,Math.round((a.x-170)/26))),Math.max(-5,Math.min(5,Math.round((170-a.y)/26)))];draw();message('点を置きました。「答えを確かめる」を押そう。')};
for(const id of ['x','y']){$('#'+id).onclick=()=>activate(id);$('#'+id).onfocus=()=>activate(id)}
$('#minus').onclick=()=>edit('minus');$('#check').onclick=check;$('#next').onclick=newQuestion;$('#refresh').onclick=newQuestion;$('#reset').onclick=reset;$('#hintButton').onclick=showHint;$('#hintNext').onclick=showHint;$('#closeHint').onclick=()=>{hideHint();draw()};
function settings(open){$('#settings').hidden=!open;$('#settingsButton').setAttribute('aria-expanded',String(open));if(open){hideHint();draw()}}
$('#settingsButton').onclick=()=>settings($('#settings').hidden);$('#closeSettings').onclick=()=>settings(false);
document.querySelectorAll('[data-mode]').forEach(e=>e.onclick=()=>{if(state.mode===e.dataset.mode)return;state.mode=e.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===e)));settings(false);newQuestion()});document.querySelectorAll('[data-set]').forEach(e=>e.onclick=()=>{state.set=e.dataset.set;state.bag=[];document.querySelectorAll('[data-set]').forEach(b=>b.setAttribute('aria-pressed',String(b===e)));settings(false);newQuestion()});
$('#keypad').innerHTML=['1','2','3','4','5','back','6','7','8','9','0','clear'].map(k=>`<button data-key="${k}" aria-label="${k==='back'?'１文字削除':k==='clear'?'入力を消す':k}">${k==='back'?'⌫':k==='clear'?'消す':k}</button>`).join('');document.querySelectorAll('[data-key]').forEach(e=>e.onclick=()=>edit(e.dataset.key));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeInput();hideHint();settings(false);draw();return}if(!state.active)return;if(e.key==='Enter'){e.preventDefault();check()}else if(/^\d$/.test(e.key)||['-','Backspace','Delete'].includes(e.key)){e.preventDefault();edit(e.key==='-'?'minus':e.key==='Backspace'?'back':e.key==='Delete'?'clear':e.key)}});
let frame=0;function fit(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{const app=$('#app').getBoundingClientRect(),plot=$('#plot'),r=plot.getBoundingClientRect(),h=Math.max(150,Math.min(r.width,(window.visualViewport?.height||window.innerHeight)-(app.height-r.height)-14));if(Math.abs(r.height-h)>.5)plot.style.height=h+'px'})}
window.addEventListener('resize',fit);window.visualViewport?.addEventListener('resize',fit);newQuestion();
</script></body></html>
