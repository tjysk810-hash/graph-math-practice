<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f6fc"><title>反比例のグラフと式</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#182744;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;border:0;border-radius:9px;color:inherit;min-height:42px}button:focus-visible,input:focus-visible{outline:3px solid #eab52c}button:disabled{opacity:.5}[hidden]{display:none!important}main{max-width:470px;margin:auto;padding:10px 12px}header{display:flex;align-items:center;justify-content:space-between;height:38px}h1{font-size:19px;margin:0}.quiet{background:transparent;color:#2c52cc;font-size:13px}.modes{display:flex;background:#e3eaf6;border-radius:10px;padding:3px;margin:5px 0}.modes button{flex:1;background:transparent;font-size:14px;min-height:34px}.modes [aria-pressed=true]{background:white;color:#2c52cc;font-weight:700}.question{font-size:13px;min-height:33px;display:flex;align-items:center;gap:8px}.question b{color:#2c52cc}#plot{position:relative;margin:0 -12px;background:white;border-block:1px solid #dbe2ef;height:min(94vw,410px)}svg{width:100%;height:100%;display:block;touch-action:manipulation}#hintButton{position:absolute;top:5px;left:6px;border:1px solid #dbe2ef;border-radius:50%;width:32px;min-height:32px;background:#eef3ff;color:#2c52cc;font-size:20px}#problem{background:#eaf0ff;margin:0 -12px 12px;padding:9px 15px;display:flex;align-items:center;justify-content:space-between;min-height:58px}#problem small{color:#59677e}#coordinate{font-size:26px;font-family:Georgia,serif}#refresh{min-height:28px;padding:2px 8px;border:1px solid #cbd5e8;background:white;color:#2c52cc;font-size:12px}.meta{display:flex;flex-direction:column;gap:4px}.answer{display:flex;gap:7px;align-items:center}.answer span{font-size:23px}.answer input{min-width:0;width:100%;height:44px;border:1px solid #cbd5e8;border-radius:9px;text-align:center;background:white;color:#182744;font-size:19px}.answer input.active{border:2px solid #2c52cc}.minus{flex:0 0 35px;background:#e6edf8;font-size:24px}.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:7px}.keypad button{background:white;border:1px solid #dbe2ef;font-size:21px;min-height:39px}.keypad button:last-child{font-size:12px}#feedback{min-height:47px;display:flex;align-items:center;font-size:14px;line-height:1.5;padding:6px 0;color:#59677e}#feedback.error{color:#ad302c}#feedback.success{color:#08767c;font-weight:bold}footer{display:flex;gap:8px}footer button{padding:8px 14px}#reset{background:white;border:1px solid #cbd5e8}#check,#next{flex:1;background:#2c52cc;color:white;font-weight:bold}.note{font-size:11px;color:#59677e;margin:10px 0}#hint{position:absolute;z-index:3;top:6px;left:10px;right:10px;background:white;border:1px solid #a7bcef;box-shadow:0 3px 15px #17305520;border-radius:12px;padding:8px 10px;max-height:110px;overflow:auto}main{position:relative}.hint-head{display:flex;align-items:center;gap:4px;font-size:13px}.hint-head b{margin-right:auto}.hint-head button{min-height:28px}#hintText{font-size:14px;line-height:1.5;margin:3px 0}#settings{position:absolute;top:48px;left:10px;right:10px;z-index:4;background:white;border:1px solid #cad5ea;border-radius:12px;padding:12px;box-shadow:0 5px 20px #17305520}#settings p{font-size:12px;line-height:1.7;color:#59677e}.options{display:flex;gap:5px}.options button{flex:1;background:#f3f6fc;font-size:13px}.options [aria-pressed=true]{background:#e1eaff;color:#2c52cc;border:1px solid #2c52cc}@media(max-height:700px){main{padding-top:4px}.note{display:none}#feedback{min-height:38px}}

#pointControls button{width:38px;flex-shrink:0}#pointControls [aria-pressed=true]{background:#dce7ff;color:#2c52cc;border-bottom:3px solid #2c52cc}#pointInfo{font-size:13px;color:#59677e}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.15;margin:0 4px}.frac span:first-child{border-bottom:1.5px solid;padding:0 4px 3px}.frac span:last-child{padding:3px 4px 0}#fraction{font-size:12px;flex:0 0 39px}#answer label{white-space:nowrap;font-size:22px;font-family:Georgia,serif}#coordinate{font-size:27px}.answer{min-height:44px}#hint{max-height:112px}
#problem{min-height:76px}#coordinate{font-size:26px}#hintText .frac{font-size:1em}.level-note{font-size:12px;color:#59677e}</style></head><body><main id="app"><header><h1>反比例のグラフと式</h1><button id="settingsButton" class="quiet" aria-expanded="false">設定 ≫</button></header><section id="settings" hidden><div class="hint-head"><b>点の読み取り</b><button id="closeSettings" class="quiet">閉じる</button></div><div class="options"><button data-level="shown" aria-pressed="true">座標を表示</button><button data-level="read" aria-pressed="false">目盛りから読む</button></div><p>正負の比例定数を出題します。点Pは整数の座標にあります。「目盛りから読む」では、ヒントを進めると座標を確認できます。</p></section><div class="question"><b id="number">01</b><span id="instruction"></span></div><section id="plot" aria-label="座標平面"><svg id="graph" viewBox="0 0 340 340" role="group" aria-label="座標平面"></svg><button id="hintButton" aria-label="ヒントを表示" aria-expanded="false">?</button></section><section id="problem"><div class="meta"><small id="problemLabel"></small><button id="refresh">更新</button></div><div id="coordinate"></div></section><section id="answer" class="answer" aria-label="比例定数の入力"><button id="minus" class="minus" aria-label="比例定数の符号を変える">−</button><button id="fraction" aria-label="比例定数を分数で入力">分数</button><label for="a"><i>a</i>＝</label><input id="a" readonly inputmode="none" placeholder="a" aria-label="比例定数 a"></section><section id="keypad" class="keypad" aria-label="数字入力" hidden></section><div id="feedback" role="status" aria-live="polite"></div><footer><button id="reset">やり直す</button><button id="check">答えを確かめる</button><button id="next" hidden>次の問題</button></footer><p class="note">計算は紙で。点の座標と、反比例の式を結びつけよう。</p><aside id="hint" hidden><div class="hint-head"><b id="hintTitle"></b><button id="hintNext" class="quiet">次のヒント</button><button id="closeHint" class="quiet" aria-label="ヒントを閉じる">×</button></div><p id="hintText"></p></aside></main><script>'use strict';
const $=s=>document.querySelector(s),state={level:'shown',q:null,value:'',active:false,solved:false,hint:0,count:0,signs:[]};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function parse(s){if(!/^-?\d{1,3}(\/\d{1,3})?$/.test(s))throw Error('比例定数 a を入力しよう。');let[n,d=1]=s.split('/').map(Number);if(!d)throw Error('分母は 0 にできません。');const g=gcd(n,d);return{n:n/g,d:d/g}}
const frac=(top,bottom)=>`<span class="frac"><span>${top}</span><span>${bottom}</span></span>`;
function formula(a){return `<i>y</i> = ${typeof a==='number'?(a<0?'−':'')+frac(Math.abs(a),'<i>x</i>'):frac('<i>a</i>','<i>x</i>')}`}
function makePool(){const out=[];for(let x=-4;x<=4;x++)for(let y=-4;y<=4;y++){if(!x||!y||Math.abs(x*y)>12)continue;out.push({a:x*y,point:[x,y]})}return out}
const pool=makePool();
function newQuestion(){if(!state.signs.length)state.signs=Math.random()<.5?[1,-1]:[-1,1];const sign=state.signs.pop(),choices=pool.filter(q=>Math.sign(q.a)===sign&&(!state.q||q.a!==state.q.a||q.point.join(',')!==state.q.point.join(',')));state.q=choices[Math.floor(Math.random()*choices.length)];state.count++;$('#number').textContent=String(state.count).padStart(2,'0');reset()}
function message(t,c=''){$('#feedback').textContent=t;$('#feedback').className=c}
function closeInput(){state.active=false;$('#keypad').hidden=true;$('#a').classList.remove('active');fit()}
function hideHint(){state.hint=0;$('#hint').hidden=true;$('#hintButton').setAttribute('aria-expanded','false')}
function reset(){state.value='';state.solved=false;hideHint();closeInput();$('#a').value='';for(const id of ['a','minus','fraction'])$('#'+id).disabled=false;$('#check').hidden=false;$('#next').hidden=true;$('#instruction').textContent=state.level==='shown'?'点Pの座標から、式を求めよう。':'点Pの座標を読み取り、式を求めよう。';$('#problemLabel').textContent='答えの式';$('#coordinate').innerHTML=formula();message('紙で比例定数 a を求めて入力しよう。');draw();fit()}
const px=x=>170+26*x,py=y=>170-26*y;
function curvePath(a,sign){const start=Math.abs(a)/5;let path='';for(let i=0;i<=200;i++){const x=sign*(start+(5-start)*i/200),y=a/x;path+=(i?'L':'M')+px(x).toFixed(3)+' '+py(y).toFixed(3)}return path}
function draw(){let s='<defs><clipPath id="clip"><rect x="40" y="40" width="260" height="260"/></clipPath></defs>';for(let i=-5;i<=5;i++){s+=`<path d="M${px(i)} 40V300 M40 ${py(i)}H300" stroke="#e2e9f3"/>`;if(i)s+=`<text x="${px(i)}" y="185" text-anchor="middle">${i}</text><text x="160" y="${py(i)+4}" text-anchor="end">${i}</text>`}s='<g fill="#65768f" font-size="11">'+s+'</g><path d="M30 170H324m-7-5 7 5-7 5 M170 310V20m-5 7 5-7 5 7" fill="none" stroke="#6c809e" stroke-width="1.5"/><text x="327" y="174" font-size="15">x</text><text x="178" y="24" font-size="15">y</text><text x="156" y="185" font-size="11">0</text>';
for(const sign of [-1,1])s+=`<path d="${curvePath(state.q.a,sign)}" fill="none" stroke="#2c52cc" stroke-width="2.6" clip-path="url(#clip)"/>`;
const[x,y]=state.q.point;if(state.hint>=2)s+=`<path d="M${px(x)} 170V${py(y)}H170" fill="none" stroke="#07857f" stroke-width="1.6" stroke-dasharray="4 3"/>`;
const label=state.level==='shown'||state.hint>=2||state.solved?`P (${x}, ${y})`:'P',right=x>0,tx=px(x)+(right?-9:9),ty=py(y)+(y>0?20:-12);
s+=`<circle cx="${px(x)}" cy="${py(y)}" r="5" fill="${state.solved?'#08767c':'#2c52cc'}" stroke="white" stroke-width="2"/><text x="${tx}" y="${ty}" text-anchor="${right?'end':'start'}" fill="#2c52cc" font-size="13" font-weight="bold" stroke="white" stroke-width="4" paint-order="stroke">${label}</text>`;
$('#graph').innerHTML=s;$('#graph').setAttribute('aria-label',label==='P'?'反比例のグラフ。点Pの座標を目盛りから読み取ろう。':`反比例のグラフ。点Pの座標は (${x}, ${y})。`)}
function activate(){if(state.solved)return;state.active=true;$('#keypad').hidden=false;$('#a').classList.add('active');fit()}
function edit(k){if(state.solved)return;if(!state.active)activate();let v=state.value;if(k==='minus')v=v.startsWith('-')?v.slice(1):'-'+v;else if(k==='fraction'){if(v&&v!=='-'&&!v.includes('/'))v+='/'}else if(k==='back')v=v.slice(0,-1);else if(k==='clear')v='';else if(/^\d$/.test(k)&&v.length<8)v+=k;state.value=v;$('#a').value=v;message('入力できたら「答えを確かめる」を押そう。')}
function check(){if(state.solved)return;closeInput();let a;try{a=parse(state.value)}catch(e){message(e.message,'error');return}if(a.n!==state.q.a*a.d){message(a.n/a.d===-state.q.a?'大きさは合っています。x と y の符号を確認しよう。':'点Pの x と y を式に代入して確かめよう。','error');return}state.solved=true;hideHint();for(const id of ['a','minus','fraction'])$('#'+id).disabled=true;$('#check').hidden=true;$('#next').hidden=false;$('#coordinate').innerHTML=formula(state.q.a);const[x,y]=state.q.point;message(`正解！ a = (${x}) × (${y}) = ${state.q.a}。`,'success');draw();fit()}
function showHint(){state.hint=Math.min(3,state.hint+1);$('#hint').hidden=false;$('#hintButton').setAttribute('aria-expanded','true');$('#hintTitle').textContent=`ヒント ${state.hint}/3`;$('#hintNext').hidden=state.hint===3;const[x,y]=state.q.point;$('#hintText').innerHTML=state.hint===1?`反比例の式は ${formula()}。点Pの x、y を使おう。`:state.hint===2?`点Pは (${x}, ${y})。式に代入すると ${y} = ${frac('<i>a</i>',x)}。`:`両辺に x をかけると a = xy。<br>a = (${x}) × (${y}) を計算しよう。`;draw()}
function settings(open){$('#settings').hidden=!open;$('#settingsButton').setAttribute('aria-expanded',String(open));if(open){hideHint();draw()}}
$('#settingsButton').onclick=()=>settings($('#settings').hidden);$('#closeSettings').onclick=()=>settings(false);document.querySelectorAll('[data-level]').forEach(e=>e.onclick=()=>{state.level=e.dataset.level;document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',String(b===e)));settings(false);newQuestion()});
$('#a').onclick=activate;$('#a').onfocus=activate;$('#minus').onclick=()=>edit('minus');$('#fraction').onclick=()=>edit('fraction');$('#check').onclick=check;$('#next').onclick=newQuestion;$('#reset').onclick=reset;$('#refresh').onclick=newQuestion;$('#hintButton').onclick=showHint;$('#hintNext').onclick=showHint;$('#closeHint').onclick=()=>{hideHint();draw()};
$('#keypad').innerHTML=['1','2','3','4','5','back','6','7','8','9','0','clear'].map(k=>`<button data-key="${k}" aria-label="${k==='back'?'１文字削除':k==='clear'?'入力を消す':k}">${k==='back'?'⌫':k==='clear'?'消す':k}</button>`).join('');document.querySelectorAll('[data-key]').forEach(e=>e.onclick=()=>edit(e.dataset.key));document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeInput();hideHint();settings(false);draw();return}if(!state.active)return;if(e.key==='Enter'){e.preventDefault();check()}else if(/^\d$/.test(e.key)||['-','/','Backspace','Delete'].includes(e.key)){e.preventDefault();edit(e.key==='-'?'minus':e.key==='/'?'fraction':e.key==='Backspace'?'back':e.key==='Delete'?'clear':e.key)}});
let frame=0;function fit(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{const app=$('#app').getBoundingClientRect(),plot=$('#plot'),r=plot.getBoundingClientRect(),h=Math.max(150,Math.min(r.width,(window.visualViewport?.height||window.innerHeight)-(app.height-r.height)-14));if(Math.abs(r.height-h)>.5)plot.style.height=h+'px'})}window.addEventListener('resize',fit);window.visualViewport?.addEventListener('resize',fit);newQuestion();
</script></body></html>
