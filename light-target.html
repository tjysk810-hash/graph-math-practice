<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c32"><title>ひかりの的あて</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c32;color:#f2f6ff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}main{max-width:460px;margin:auto;padding:16px 14px max(16px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;letter-spacing:.04em;margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #ffc66e;outline-offset:3px}.quiet{background:#21324b;color:#b9cbe2;border:1px solid #3c506c;border-radius:12px;padding:9px 12px;font-size:13px}.subtitle{font-size:12px;color:#a9bad2;margin:6px 0 15px}.progress{display:flex;align-items:center;gap:8px;margin:0 0 12px}.lamp{height:7px;flex:1;background:#2b3c55;border-radius:8px;transition:.3s}.lamp.on{background:#69e4d4;box-shadow:0 0 12px #69e4d466}#count{font-size:12px;color:#aec1da;margin-left:5px}.mission{display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px;font-size:13px;color:#b9cbe2}.coordinate{font-size:22px;font-weight:700;color:#ffd292;font-variant-numeric:tabular-nums}.graph{position:relative;border:1px solid #31445e;background:#14223b;border-radius:18px;overflow:hidden}svg{display:block;width:100%;height:auto}#help{position:absolute;right:9px;bottom:42px;width:36px;height:36px;border:1px solid #49617e;border-radius:50%;background:#243752;color:#d8e8ff;font-weight:700;font-size:20px}.equation{display:flex;align-items:center;justify-content:center;gap:9px;margin:14px 0 10px;font-size:21px}.equation small{font-size:12px;color:#b9cbe2;margin-right:8px}.variable{font-family:Georgia,serif;font-style:italic;font-size:27px}.slot{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:38px;border-bottom:2px solid #69e4d4;color:#69e4d4;font-weight:700}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.choice{min-height:55px;background:#263c58;border:1px solid #526885;border-radius:13px;color:white;font-size:25px;font-weight:700}.choice:active{transform:scale(.96)}.choice.miss{color:#bdc9da;background:#1d2b40;border-style:dashed}.choice.hit{background:#69e4d4;color:#102b36;border-color:#69e4d4}.choice:disabled{cursor:default}.feedback{min-height:59px;margin:13px 0 7px;font-size:14px;line-height:1.7;color:#d0dbee}.feedback.good{color:#8cf0de}.next{width:100%;min-height:46px;background:#69e4d4;color:#122c3a;border:0;border-radius:12px;font-weight:700;font-size:16px}.next:disabled{background:#24354c;color:#91a2ba}.foot{text-align:center;font-size:11px;color:#9cacc2;margin:10px 0 0}.beam{filter:drop-shadow(0 0 3px #ff315b) drop-shadow(0 0 7px #ff315b);stroke-dasharray:600;stroke-dashoffset:600;animation:shoot .45s ease-out forwards}.ring{transform-box:fill-box;transform-origin:center;animation:pop .65s ease-out}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;align-items:center;font-size:.7em;line-height:1.05}.frac span:first-child{border-bottom:1px solid currentColor;width:100%;padding:0 3px 2px}.frac span:last-child{padding-top:2px}@keyframes shoot{to{stroke-dashoffset:0}}@keyframes pop{from{opacity:0;scale:.6}to{opacity:1;scale:1}}@media(max-height:740px){main{padding-top:9px}.subtitle{margin-bottom:9px}.graph{max-width:350px;margin:auto}.equation{margin:9px 0}.feedback{margin-top:8px;min-height:49px}.choice{min-height:48px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.beam{stroke-dashoffset:0}}
.header-actions{display:flex;gap:5px}.header-actions .quiet{padding:8px;font-size:11px}h1{font-size:20px}.graph{background:radial-gradient(ellipse at 65% 25%,#233a56 0%,#14223b 65%)}.lamp{height:20px;background:#33445d;clip-path:polygon(50% 0%,61% 34%,98% 35%,69% 57%,80% 94%,50% 72%,20% 94%,31% 57%,2% 35%,39% 34%);border-radius:0}.lamp.on{background:#ffe2a2;filter:drop-shadow(0 0 7px #ffc875)}.star{filter:drop-shadow(0 0 5px #ffce35)}.star.lit{filter:drop-shadow(0 0 5px #ffe44d) drop-shadow(0 0 12px #ffb524)}.spark{animation:spark .75s ease-out forwards}@keyframes spark{from{opacity:1;stroke-width:3}to{opacity:0;stroke-width:0}}@media(max-width:350px){h1{font-size:18px}.equation{gap:6px}.equation small{font-size:11px;margin-right:2px}}
[hidden]{display:none!important}.modes{display:flex;gap:4px;background:#1c2c44;border-radius:12px;padding:3px;margin:0 0 10px}.modes button{flex:1;border:0;border-radius:9px;padding:9px;background:transparent;color:#b9cbe2;font-weight:700}.modes button[aria-pressed="true"]{background:#3b506d;color:white}.entry{display:flex;align-items:center;justify-content:center;gap:7px;margin:10px 0}.entry input{width:68px;min-width:0;height:44px;border:1px solid #7492b5;border-radius:8px;background:#203550;color:#fff;text-align:center;font:700 22px inherit;font-size:22px}.entry input:focus{outline:2px solid #69e4d4}.entry .number-stack.fractional{display:flex;flex-direction:column;gap:3px}.number-stack.fractional input{height:30px;font-size:19px;border-radius:5px}.number-stack.fractional input:first-child{border-bottom:2px solid #dceaff}.fire{background:#ff476c;color:white;border:0;border-radius:11px;min-height:46px;padding:0 16px;font-weight:700}.fire:disabled{opacity:.45}.input-caption{font-size:12px;color:#b9cbe2;margin:9px 0 0;text-align:center}.launcher-arm{transition:transform .15s ease-out}.feedback{min-height:49px}@media(max-width:350px){.entry{gap:5px}.entry input{width:57px}.fire{padding:0 12px}.entry .quiet{padding:9px 7px}}
.entry .fire{margin-left:24px;flex-shrink:0}

main{padding:8px 12px max(16px,env(safe-area-inset-bottom))}h1{font-size:18px}.subtitle,.foot,.input-caption{display:none}.header-actions .quiet{padding:7px;font-size:11px}.modes{margin:8px 0 6px}.modes button{padding:7px}.progress{margin:0 0 4px;gap:7px}.lamp{flex:0 0 19px;width:19px;height:19px}#count{margin-left:auto}.mission{margin:4px 0 6px}.coordinate{font-size:20px}.graph{width:100%;max-width:min(100%,calc(100dvh - 320px));margin:auto}body.input-mode .graph{max-width:min(100%,calc(100dvh - 400px))}.equation{margin:8px 0 6px}.choice{min-height:44px}.entry{margin:7px 0}.entry input{height:40px}.entry input.selected{outline:2px solid #69e4d4;background:#2e4560}.number-stack.fractional input{height:27px}.fire{min-height:44px}.feedback{min-height:40px;margin:7px 0;font-size:13px;line-height:1.5}.next{min-height:44px}.keypad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.keypad button{height:40px;border:1px solid #526885;border-radius:9px;background:#243b57;color:#f3f7ff;font-size:21px}.keypad button:active{background:#476585}.keypad button:disabled{opacity:.4}.graph{min-width:220px}
</style></head><body><main>
<header><h1>ひかりの的あて</h1><div class="header-actions"><button class="quiet" id="sound" aria-pressed="true" aria-label="効果音を切る">音 ON</button><button class="quiet" id="restart">はじめから</button></div></header><p class="subtitle">比例の光をのばして、５つの的を灯そう。</p>
<nav class="modes" aria-label="遊び方"><button id="choiceMode" aria-pressed="true">４択</button><button id="inputMode" aria-pressed="false">自分で入力</button></nav>
<div class="progress" aria-label="進み具合"><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><span id="count"></span></div>
<div class="mission"><span>ねらう座標 <strong class="coordinate" id="coord"></strong></span><span>第１象限</span></div>
<div class="graph"><svg id="graph" viewBox="0 0 380 380" role="img" aria-label="第１象限の座標平面"></svg><button id="help" aria-label="ヒントを見る">？</button></div>
<div class="equation" id="choiceEquation"><small>比例定数を選んで発射</small><span class="variable">y</span>＝<span class="slot" id="coefficient">?</span><span class="variable">x</span></div>
<div class="choices" id="choices"></div><section id="inputPanel" hidden aria-label="比例定数を入力"><p class="input-caption">数値で向きを調整 → 発射</p><div class="entry"><span class="variable">y</span><span>＝</span><div class="number-stack" id="numberStack"><input id="numerator" inputmode="none" readonly autocomplete="off" aria-label="比例定数" placeholder="a"><input id="denominator" inputmode="none" readonly autocomplete="off" aria-label="分母" placeholder="分母" hidden></div><span class="variable">x</span><button class="fire" id="fire" disabled>発射</button></div><div id="keypad" class="keypad" aria-label="数字キー"></div></section><p class="feedback" id="feedback" role="status" aria-live="polite"></p><button class="next" id="next" disabled>比例定数を選ぼう</button><p class="foot">時間制限なし・何度でも試せます</p>
</main><script>
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const values=[.5,1,2,3,4], range=12, origin=32, unit=26, bottom=344;
let questions=[],index=0,hit=false,attempts=[],hint=0,locked=false,shotTimer=0,session=0,mode='choice',fractional=false,aim=null,displayAim=0,rotationFrame=0,rotating=false;
const fmt=v=>v===.5?'½':String(v);
const math=v=>v===.5?'<span class="frac"><span>1</span><span>2</span></span>':String(v);
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function el(tag,attrs={},text=''){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));e.textContent=text;return e}
function add(tag,attrs,text){const e=el(tag,attrs,text);$('graph').append(e);return e}
function line(x1,y1,x2,y2,attrs={}){return add('line',{x1:origin+x1*unit,y1:bottom-y1*unit,x2:origin+x2*unit,y2:bottom-y2*unit,...attrs})}
function draw(){
 const q=questions[index];$('graph').replaceChildren();
 for(let k=1;k<=range;k++){line(k,0,k,range,{stroke:'#293c57','stroke-width':1});line(0,k,range,k,{stroke:'#293c57','stroke-width':1});add('text',{x:origin+k*unit,y:363,fill:'#a9bdd5','font-size':10,'text-anchor':'middle'},k);add('text',{x:24,y:bottom-k*unit+4,fill:'#a9bdd5','font-size':10,'text-anchor':'end'},k)}
 line(0,0,12.7,0,{stroke:'#9dafc8','stroke-width':1.5});line(0,0,0,12.7,{stroke:'#9dafc8','stroke-width':1.5});add('text',{x:368,y:349,fill:'#d5e2f5','font-size':15},'x');add('text',{x:27,y:13,fill:'#d5e2f5','font-size':15},'y');add('text',{x:21,y:359,fill:'#a9bdd5','font-size':11},'0');
 for(const a of attempts){const endX=Math.min(range,range/a);line(0,0,endX,a*endX,{stroke:a===q.a?'#fff2f5':'#8b9ab4',style:a===q.a?'filter:drop-shadow(0 0 3px #ff315b) drop-shadow(0 0 6px #ff315b)':'','stroke-width':a===q.a?3:1.8,opacity:a===q.a?1:.55,'stroke-dasharray':a===q.a?'none':'5 5'})}
 const px=origin+q.x*unit,py=bottom-q.y*unit;
 if(hint){line(q.x,0,q.x,q.y,{stroke:'#ffc875','stroke-dasharray':'3 5',opacity:.7});line(0,q.y,q.x,q.y,{stroke:'#ffc875','stroke-dasharray':'3 5',opacity:.7})}
 add('circle',{cx:px,cy:py,r:22,fill:hit?'#ffd43830':'#ffc87512'});
 const starPoints=Array.from({length:10},(_,i)=>{const angle=-Math.PI/2+i*Math.PI/5,r=i%2?5:12;return `${px+Math.cos(angle)*r},${py+Math.sin(angle)*r}`}).join(' ');
 add('polygon',{points:starPoints,fill:hit?'#fff4a3':'#ffd64a',stroke:hit?'#ffd52e':'#ffb629','stroke-width':1,class:hit?'star lit ring':'star'});
 if(hit){for(let j=0;j<8;j++){const a=j*Math.PI/4;add('line',{x1:px+Math.cos(a)*17,y1:py+Math.sin(a)*17,x2:px+Math.cos(a)*29,y2:py+Math.sin(a)*29,stroke:'#ffe56b','stroke-width':2,class:'spark'})}}
 drawLauncher();
 $('graph').setAttribute('aria-label',`目標は座標（${q.x}, ${q.y}）。横軸x、縦軸y、ともに0から12。`);
}
function drawLauncher(){
 const old=$('launcher');if(old&&old.remove)old.remove();
 const g=el('g',{id:'launcher'});$('graph').append(g);
 if(mode==='input'&&aim!==null&&!hit){const d=2.6/Math.hypot(1,displayAim);g.append(el('line',{x1:origin,y1:bottom,x2:origin+d*unit,y2:bottom-displayAim*d*unit,stroke:'#ff96ad','stroke-width':2,'stroke-dasharray':'4 5'}))}
 g.append(el('circle',{cx:origin,cy:bottom,r:11,fill:'#283e5c',stroke:'#b6cbe6','stroke-width':1.5}));
 const a=displayAim,arm=el('g',{transform:`translate(${origin} ${bottom}) rotate(${-Math.atan(a)*180/Math.PI})`,class:'launcher-arm'});
 arm.append(el('rect',{x:-4,y:-5,width:29,height:10,rx:3,fill:'#b8cce5',stroke:'#eff6ff','stroke-width':1}));arm.append(el('rect',{x:19,y:-4,width:6,height:8,rx:1,fill:'#ff476c'}));g.append(arm);g.append(el('circle',{cx:origin,cy:bottom,r:4,fill:'#eff6ff'}));
}
function parseAim(){const n=$('numerator').value.trim(),d=$('denominator').value.trim();if(!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(n))return null;if(fractional&&!/^\d+$/.test(d))return null;const value=Number(n)/(fractional?Number(d):1);return Number.isFinite(value)&&value>0?value:null}
function stopRotation(){if(rotationFrame)cancelAnimationFrame(rotationFrame);rotationFrame=0;rotating=false;}
function updateAim(){aim=parseAim();stopRotation();$('fire').disabled=aim===null||hit||locked;if(aim===null){drawLauncher();return}const start=Math.atan(displayAim),end=Math.atan(aim);if(Math.abs(start-end)<.001){displayAim=aim;drawLauncher();return}rotating=true;$('fire').disabled=true;const began=performance.now();function frame(now){const progress=Math.min(1,(now-began)/650),ease=progress*progress*(3-2*progress);displayAim=Math.tan(start+(end-start)*ease);drawLauncher();if(progress<1)rotationFrame=requestAnimationFrame(frame);else{displayAim=aim;rotationFrame=0;rotating=false;$('fire').disabled=hit||locked||aim===null}}rotationFrame=requestAnimationFrame(frame);}

function setMode(next){if(next===mode)return;clearTimeout(shotTimer);session++;mode=next;document.body.classList.toggle('input-mode',mode==='input');$('choiceMode').setAttribute('aria-pressed',String(mode==='choice'));$('inputMode').setAttribute('aria-pressed',String(mode==='input'));$('inputPanel').hidden=mode!=='input';$('choices').hidden=mode!=='choice';$('choiceEquation').hidden=mode!=='choice';show()}
$('choiceMode').onclick=()=>setMode('choice');$('inputMode').onclick=()=>setMode('input');
let selectedNumber='numerator';
function selectNumber(id){selectedNumber=id;for(const name of ['numerator','denominator'])$(name).classList.toggle('selected',name===id)}
function enterKey(key){if(hit||locked)return;const field=$(selectedNumber);if(key==='Backspace')field.value=field.value.slice(0,-1);else if(key==='Delete')field.value='';else if(key==='.'&&!fractional&&!field.value.includes('.'))field.value=field.value?field.value+'.':'0.';else if(/^\d$/.test(key)&&field.value.length<5)field.value+=key;updateAim()}
for(const id of ['numerator','denominator']){$(id).onclick=()=>selectNumber(id);$(id).onfocus=()=>selectNumber(id)}
for(const key of ['1','2','3','4','5','Backspace','6','7','8','9','0','.']){const b=document.createElement('button');b.textContent=key==='Backspace'?'⌫':key;b.setAttribute('aria-label',key==='Backspace'?'１文字消す':key==='.'?'小数点':key);b.onclick=()=>enterKey(key);$('keypad').append(b)}
$('fire').onclick=()=>{const a=parseAim();if(a===null||hit||locked||rotating)return;$('numerator').blur();$('denominator').blur();shoot(a)};
for(const id of ['numerator','denominator'])$(id).onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('fire').onclick()}else if(/^\d$/.test(e.key)||['.','Backspace','Delete'].includes(e.key)){e.preventDefault();enterKey(e.key)}};
function lockInput(value){for(const id of ['numerator','denominator'])$(id).disabled=value;$('fire').disabled=value||parseAim()===null;for(const button of $('keypad').children)button.disabled=value||(fractional&&button.textContent==='.')}
function candidates(a){return Array.from({length:12},(_,i)=>i+1).filter(x=>Number.isInteger(a*x)&&a*x<=range).map(x=>({a,x,y:a*x}))}
function pickFar(a){const all=candidates(a),far=all.filter(q=>Math.max(q.x,q.y)>=9);const pool=Math.random()<.85?far:all.filter(q=>Math.max(q.x,q.y)>=6);return shuffle(pool)[0]}
function setup(){clearTimeout(shotTimer);session++;const a=shuffle([1,2,3,4])[0];const far=candidates(a).filter(q=>Math.max(q.x,q.y)>=8);questions=shuffle(far).slice(0,2);for(const slope of shuffle(values.filter(v=>v!==a)).slice(0,3))questions.push(pickFar(slope));index=0;show()}
function show(){stopRotation();fractional=!Number.isInteger(questions[index].a);$('denominator').hidden=!fractional;$('numberStack').className='number-stack'+(fractional?' fractional':'');$('numerator').setAttribute('aria-label',fractional?'分子':'比例定数');hit=false;locked=false;attempts=[];hint=0;aim=null;displayAim=0;$('numerator').value='';$('denominator').value='';selectNumber('numerator');lockInput(false);$('coefficient').textContent='?';$('count').textContent=`${index+1} / 5`;$('feedback').className='feedback';$('feedback').textContent=index===1?'次の的にも、同じ向きの光が届くかな？':(mode==='input'?'比例定数を入力して狙おう。発射前なら何度でも調整できます。':'数字を選ぶと光がのびます。的に届くのはどれ？');$('next').disabled=true;$('next').textContent=mode==='input'?'狙いを決めて発射しよう':'比例定数を選ぼう';document.querySelectorAll('.lamp').forEach((l,i)=>l.classList.toggle('on',i<index));const q=questions[index];$('coord').textContent=`（${q.x}, ${q.y}）`;$('choices').replaceChildren();const options=shuffle([q.a,...shuffle(values.filter(v=>v!==q.a)).slice(0,3)]);for(const a of options){const b=document.createElement('button');b.className='choice';b.innerHTML=math(a);b.setAttribute('aria-label',`比例定数 ${a===.5?'２分の１':a} で発射`);b.onclick=()=>shoot(a,b);$('choices').append(b)}draw()}
function shoot(a,b){if(hit||locked)return;locked=true;aim=a;displayAim=a;lockInput(true);drawLauncher();playSound(false);const token=session,q=questions[index];$('coefficient').innerHTML=math(a);const ex=Math.min(range,range/a);const beam=line(0,0,ex,a*ex,{stroke:'#fff2f5','stroke-width':3,class:'beam'});shotTimer=setTimeout(()=>{if(token!==session)return;locked=false;if(!attempts.includes(a))attempts.push(a);hit=Math.abs(a-q.a)<1e-10;if(b)b.classList.add(hit?'hit':'miss');lockInput(hit);draw();if(hit){playSound(true);$('feedback').className='feedback good';$('feedback').textContent=`届いた！ ${q.x} × ${fmt(a)} ＝ ${q.y}。`+(index===1?' 遠さが変わっても、同じ比例定数だね。':'');document.querySelectorAll('.choice').forEach(e=>e.disabled=true);document.querySelectorAll('.lamp')[index].classList.add('on');$('next').disabled=false;$('next').textContent=index===4?'５つ点灯！ もう一度遊ぶ':'次の的へ';}else{$('feedback').textContent=a<q.a?'的より下を通ったね。もっと大きい比例定数で試そう。':'的より上を通ったね。もっと小さい比例定数で試そう。';}},460)}
let audioContext=null,soundEnabled=true;
function playSound(success){if(!soundEnabled)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioContext??=new Audio();audioContext.resume().catch(()=>{});const t=audioContext.currentTime;
 function note(freq,end,start,duration,type,volume){const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,start);osc.frequency.exponentialRampToValueAtTime(end,start+duration);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.012);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);osc.connect(gain);gain.connect(audioContext.destination);osc.start(start);osc.stop(start+duration+.02)}
 if(success){note(1850,180,t,.30,'triangle',.14);note(2600,320,t+.015,.23,'sine',.085);note(950,125,t+.11,.30,'sine',.06)}else{note(1250,100,t,.25,'sawtooth',.045);note(1900,240,t,.18,'sine',.07)}
 }catch(e){/* 音声非対応でもゲームを続ける */}}
$('sound').onclick=()=>{soundEnabled=!soundEnabled;$('sound').textContent=soundEnabled?'音 ON':'音 OFF';$('sound').setAttribute('aria-pressed',String(soundEnabled));$('sound').setAttribute('aria-label',soundEnabled?'効果音を切る':'効果音を入れる')};
$('next').onclick=()=>{if(!hit)return;if(index===4)setup();else{index++;show()}};
$('restart').onclick=setup;$('help').onclick=()=>{if(hit||locked)return;hint++;const q=questions[index];$('feedback').textContent=hint===1?`x が ${q.x} のとき、y が ${q.y} になる光を探そう。`:`比例定数は y ÷ x。${q.y} ÷ ${q.x} を考えてみよう。`;draw()};setup();
</script></body></html>
