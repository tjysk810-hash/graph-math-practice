<main id="app">
  <header><div class="brand"><span class="mark" aria-hidden="true">╱</span><h1>線と式<span>一次関数</span></h1></div><button id="settingsToggle" class="quiet" aria-expanded="false" aria-controls="settings">設定 ≫</button></header>
  <section id="settings" hidden aria-label="出題設定"><div class="settings-title">出題設定<button id="closeSettings" class="quiet">閉じる</button></div><div id="scopeOptions" class="level-options"><button data-scope="basic" aria-pressed="true">基本</button><button data-scope="advanced" aria-pressed="false">発展</button></div><p id="scopeNote">発展：いろいろな直線（式からグラフ）</p><label id="axisOption" hidden><input type="checkbox" id="includeAxis" checked> 縦線・横線を含む</label><div id="difficultySettings"><div class="settings-subtitle">数の難しさ</div><div class="level-options"><button data-level="integer" aria-pressed="true">整数のみ</button><button data-level="fraction" aria-pressed="false">分数あり</button></div><p>斜めの直線は変形後の傾き・切片、縦線・横線は固定する座標で区分。変更すると新しい問題になります。</p></div></section>

    <div id="hint" class="graph-popup" hidden><div class="popup-head"><b id="hintTitle">ヒント</b><button id="hintNext" class="quiet">図で見る</button><button id="closeHint" aria-label="ヒントを閉じる">×</button></div><p id="hintText"></p></div>
  </div>

<script>'use strict';
const $=s=>document.querySelector(s);
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function rat(n,d=1){if(!d)throw Error('分母は０にできません。');if(d<0){n=-n;d=-d}const g=gcd(n,d);return {n:n/g,d:d/g}}
const add=(a,b)=>rat(a.n*b.d+b.n*a.d,a.d*b.d);
const sub=(a,b)=>rat(a.n*b.d-b.n*a.d,a.d*b.d);
const mul=(a,b)=>rat(a.n*b.n,a.d*b.d);
const div=(a,b)=>rat(a.n*b.d,a.d*b.n);
const eq=(a,b)=>a.n===b.n&&a.d===b.d;
const num=a=>a.n/a.d;
const str=a=>a.d===1?String(a.n):`${a.n}/${a.d}`;
function parse(s){s=String(s).trim().replace(/−/g,'-');if(!/^-?\d{1,4}(\/\d{1,4})?$/.test(s))throw Error('整数、または「1/2」の形で入力しよう。');const[n,d=1]=s.split('/').map(Number);return rat(n,d)}
function frac(a){const sign=a.n<0?'−':'';return sign+(a.d===1?Math.abs(a.n):`<span class="frac"><span>${Math.abs(a.n)}</span><span>${a.d}</span></span>`)}
function formula(a,b){return `<i>y</i> = ${Math.abs(a.n)===a.d?(a.n<0?'−':''):frac(a)}<i>x</i>${b.n?` ${b.n<0?'−':'+'} ${frac(rat(Math.abs(b.n),b.d))}`:''}`}
function makePool(level){const map=new Map();for(let d=1;d<=4;d++)for(let n=-5;n<=5;n++){if(!n||gcd(n,d)!==1)continue;const a=rat(n,d);for(let x0=-3;x0<=3;x0++)for(let y0=-4;y0<=4;y0++){const b=sub(rat(y0),mul(a,rat(x0)));if(Math.abs(num(b))>5)continue;if(level==='integer'&&(a.d!==1||b.d!==1))continue;if(level==='fraction'&&a.d===1&&b.d===1)continue;const pts=[];for(let x=-5;x<=5;x++){const y=add(mul(a,rat(x)),b);if(y.d===1&&Math.abs(y.n)<=5)pts.push([rat(x),y])}if(pts.length<2)continue;map.set(str(a)+','+str(b),{a,b,pts})}}return [...map.values()]}
const pools={integer:makePool('integer'),fraction:makePool('fraction')};
const state={mode:'draw',level:'integer',scope:'basic',gridlessBag:[],includeAxis:true,advancedCount:0,transformed:false,q:null,count:0,values:{},points:[null,null],coefficients:null,active:null,targetPoint:0,solved:false,revealed:false,hint:0,hintTopic:null,hintStage:0,hintManual:false,readAnchor:false};
function feedback(t,type=''){$('#feedback').textContent=t;$('#feedback').className=type}
function chooseQuestion(){
 if(state.mode==='read'&&state.scope==='advanced')return chooseGridlessQuestion();
 if(state.mode==='draw'&&state.scope==='advanced')return chooseAdvancedQuestion();
 let pool=pools[state.level];if(state.count%5===4)pool=pool.filter(q=>q.b.n===0);
 if(state.q)pool=pool.filter(q=>!eq(q.a,state.q.a)||!eq(q.b,state.q.b));
 return pool[Math.floor(Math.random()*pool.length)];
}
function newQuestion(){
 state.q=chooseQuestion();state.count++;reset();
 $('#instruction').textContent=state.mode==='read'?(state.q.gridless?'交点の座標から、式を求めよう。':'この直線の式を、紙で求めよう。'):state.q.kind==='general'?'式変形か、軸との交点で描こう。':isAxisQuestion()?'式を満たす２点を選ぼう。':state.q.b.d!==1?'整数の点を見つけ、傾きで描こう。':'切片と傾きから、グラフを描こう。';
 if(state.q.kind==='general'&&!state.q.C)$('#instruction').textContent='式を変形して、グラフを描こう。';
 $('#questionNo').textContent=String(state.count).padStart(2,'0');updateSettings();updateHintButtons();
}
function reset(){state.transformed=false;state.targetPoint=0;$('#axesHintButton').setAttribute('aria-expanded','false');state.values={};state.points=[null,null];state.coefficients=null;state.solved=false;state.revealed=false;state.active=null;state.hint=0;state.hintTopic=null;state.hintStage=0;state.hintManual=false;state.readAnchor=false;$('#coefficientTip').hidden=true;$('#hint').hidden=true;$('#hintButton').setAttribute('aria-expanded','false');$('#pointTip').hidden=true;$('#check').hidden=false;$('#next').hidden=true;renderPanel();renderEquation();drawGraph();closeKeyboard();feedback(state.mode==='draw'?'グラフをタップして点Aを配置。座標入力も可。':'紙で求めた傾き a と切片 b を入力。');}
function renderPanel(){const field=(id,label)=>`<input class="number-field" id="${id}" aria-label="${label}" placeholder="${id.endsWith('x')?'x':id.endsWith('y')?'y':id}" readonly inputmode="none" autocomplete="off" value="">`;

function interactiveFormula(a,b){

function hintGeometry(q,mode){

 let start,end;
 if(mode==='read'){start=q.pts[0];end=q.pts[q.pts.length-1];}
 else if(q.b.d!==1){start=q.pts[0];end=q.pts[1];}
 else {
  const right=[rat(q.a.d),add(q.b,rat(q.a.n))];
  if(Math.abs(num(right[1]))<=6){start=intercept;end=right;}
  else{start=[rat(-q.a.d),sub(q.b,rat(q.a.n))];end=intercept;}

 ${q.b.d!==1?fractionalMark:`<circle cx="${px(0)}" cy="${by}" r="10" fill="#0d7f8515" stroke="#0d7f85" stroke-width="2.5"/>${label(px(0)-15,by+(Math.abs(by-y1)<8? -13:5),'切片','#08767c','end')}`}

function suggestedHintTopic(){
 if(state.q.gridless)return 'coordinateDifference';
 if(isAxisQuestion())return 'fixed';
 if(state.q.kind==='general'&&!state.transformed)return 'transform';
 if(state.mode==='read')return state.readAnchor||(state.coefficients&&eq(state.coefficients.b,state.q.b))?'slope':'intercept';

 return state.points.some(p=>p&&(!fractionalIntercept||(p[0].d===1&&p[1].d===1))&&eq(p[1],add(mul(state.q.a,p[0]),state.q.b)))?'slope':fractionalIntercept?'integerPoint':'intercept';
}
function integerPointExample(q){
 const badX=[1,2,3,4,5].find(x=>add(mul(q.a,rat(x)),q.b).d!==1);
 const badY=add(mul(q.a,rat(badX)),q.b);
 const candidates=q.pts.slice().sort((p,r)=>{const rank=x=>x>0?x:20+Math.abs(x);return rank(num(p[0]))-rank(num(r[0]));});

}

function snapGraphPoint(x,y){
 if(x<48||x>312||y<28||y>292)return null;
 return [Math.round((x-180)/22)||0,Math.round((160-y)/22)||0];
}
function placeGraphPoint(event){
 if(state.mode==='read'&&event.target.closest('[data-hint-intercept]')){state.readAnchor=true;showHint();return;}
 if(state.mode!=='draw'||state.solved||event.target.closest('.plot-point'))return;
 const svg=$('#graph'),matrix=svg.getScreenCTM();
 if(!matrix)return;
 const position=svg.createSVGPoint();position.x=event.clientX;position.y=event.clientY;
 const local=position.matrixTransform(matrix.inverse());
 const point=snapGraphPoint(local.x,local.y);if(!point)return;
 const i=state.targetPoint;
 for(const [axis,value]of [['x',point[0]],['y',point[1]]]){const id=`p${i}${axis}`;state.values[id]=String(value);$('#'+id).value=String(value);}
 commit(String(i));
 if(!state.points[1-i]){selectPoint(1-i);feedback(`点${i?'B':'A'}を配置。次は点${state.targetPoint?'B':'A'}をタップ。`)}
 else feedback('２点を結びました。A・Bを選ぶと置き直せます。');
}
$('#graph').addEventListener('click',placeGraphPoint);
$('#equation').addEventListener('click',event=>{
 const term=event.target.closest('[data-topic]');if(!term)return;
 const topic=term.dataset.topic;
 $('#hint').hidden=true;$('#hintButton').setAttribute('aria-expanded','false');$('#axesHintButton').setAttribute('aria-expanded','false');drawGraph();
 $('#coefficientTipAction').dataset.topic=topic;
 $('#coefficientTipAction').textContent=topic==='slope'?'傾き':'切片';
 $('#coefficientTipAction').setAttribute('aria-label',(topic==='slope'?'傾き':'切片')+'を図で見る');
 $('#coefficientTip').hidden=false;
});
$('#coefficientTipAction').onclick=()=>showHint($('#coefficientTipAction').dataset.topic,2);
$('#closeCoefficientTip').onclick=()=>{$('#coefficientTip').hidden=true};

function isAxisQuestion(q=state.q){return q?.kind==='vertical'||q?.kind==='horizontal';}
function distinctPoints(points){return !eq(points[0][0],points[1][0])||!eq(points[0][1],points[1][1]);}
function pointOnQuestion(q,p){
 if(q.kind==='vertical')return eq(p[0],q.k);
 if(q.kind==='horizontal')return eq(p[1],q.k);
 return eq(p[1],add(mul(q.a,p[0]),q.b));
}
function toGeneral(q){
 const scale=q.a.d*q.b.d/gcd(q.a.d,q.b.d);
 let A=-q.a.n*scale/q.a.d,B=scale,C=q.b.n*scale/q.b.d;
 const g=gcd(gcd(A,B),C);A/=g;B/=g;C/=g;
 if(A<0){A=-A;B=-B;C=-C;}
 return {...q,kind:'general',A,B,C};
}
const advancedPools={};
for(const level of ['integer','fraction']){
 advancedPools[level]={general:pools[level].filter(q=>!q.b.n||Math.abs(num(div(rat(-q.b.n,q.b.d),q.a)))<=5).map(toGeneral),vertical:[],horizontal:[]};
 for(const kind of ['vertical','horizontal'])for(let d=1;d<=4;d++)for(let n=-12;n<=12;n++){
  if(gcd(n,d)!==1||Math.abs(n/d)>4||(level==='integer'?d!==1:d===1))continue;
  const k=rat(n,d),pts=kind==='vertical'?[[k,rat(-2)],[k,rat(2)]]:[[rat(-2),k],[rat(2),k]];
  advancedPools[level][kind].push({kind,k,a:rat(0),b:k,pts});
 }
}
function questionKey(q){return q?.kind==='vertical'?'x='+str(q.k):str(q?.a||rat(0))+','+str(q?.b||rat(0));}
function chooseAdvancedQuestion(){
 const cycle=['general','general','vertical','general','horizontal','general'];
 const kind=state.includeAxis?cycle[state.advancedCount++%cycle.length]:'general';
 let pool=advancedPools[state.level][kind];const alternate=pool.filter(q=>questionKey(q)!==questionKey(state.q));if(alternate.length)pool=alternate;
 return pool[Math.floor(Math.random()*pool.length)];
}
function algebraTerm(n,variable,first=false){
 const coefficient=Math.abs(n)===1?'':String(Math.abs(n));
 return (n<0?'−':first?'':'+')+coefficient+`<i>${variable}</i>`;
}
function advancedFormula(q){
 if(isAxisQuestion(q))return `<span class="advanced-equation"><i>${q.kind==='vertical'?'x':'y'}</i> = ${frac(q.k)}</span>`;
 return `<span class="advanced-equation">${algebraTerm(q.A,'x',true)} ${algebraTerm(q.B,'y')} = ${q.C<0?'−'+Math.abs(q.C):q.C}</span>`;
}
function updateSettings(){
 const advanced=state.scope==='advanced',gridless=advanced&&state.mode==='read';
 $('h1 span').textContent=gridless?'座標から式':advanced?'いろいろな直線':'一次関数';
 document.querySelectorAll('[data-scope]').forEach(el=>{el.disabled=false;el.setAttribute('aria-pressed',String(el.dataset.scope===state.scope))});
 $('#axisOption').hidden=!advanced||gridless;
 $('#difficultySettings').hidden=gridless;
 $('#includeAxis').checked=state.includeAxis;
 $('#scopeNote').textContent=state.mode==='read'?'発展：グリッドなし。交点と切片は整数、傾きは整数・分数を混ぜて出題。':'発展：いろいろな直線（式からグラフ）';
 $('#levelBadge').textContent=gridless?'発展・目盛りなし':(advanced?'発展・':'')+(state.level==='integer'?'整数':'分数');
}
function updateHintButtons(){
 const general=state.q.kind==='general';
 $('#hintButton').textContent=general?'? 式変形':'?';
 $('#hintButton').classList.toggle('method-hint',general);
 $('#hintButton').setAttribute('aria-label',general?'式変形のヒント':'ヒントを表示');
 $('#axesHintButton').hidden=!general||state.q.C===0;
}
function advanceHint(){
 if(state.hintTopic==='transform'&&state.hintStage===3){state.transformed=true;showHint(null,1);return;}
 showHint(state.hintManual?state.hintTopic:null);
}
function paintAdvancedHint(){
 const q=state.q,t=state.hintTopic,n=state.hintStage;
 const title={transform:'式変形',axes:'軸との交点',fixed:'縦線・横線'}[t];
 $('#hintTitle').textContent=title+'のヒント '+n+'/'+hintStages(t);
 $('#hintNext').hidden=n===hintStages(t)&&t!=='transform';
 $('#hintNext').textContent=t==='transform'&&n===3?'切片・傾きへ':'次のヒント';
 $('#hint').setAttribute('data-worked',String(n>=2));
 const calculation=html=>`<span class="advanced-calculation">${html}</span>`;
 if(t==='transform'){
  if(n===1)$('#hintText').innerHTML='まず <i>y</i> = … の形に直せるかな？';
  if(n===2)$('#hintText').innerHTML='x の項を右辺へ移項しよう。'+calculation(`${algebraTerm(q.B,'y',true)} = ${q.C} ${algebraTerm(-q.A,'x')}`)+`両辺を ${q.B} で割ると？`;
  if(n===3)$('#hintText').innerHTML=calculation(formula(q.a,q.b))+'この式の切片と傾きから描こう。';
  return;
 }
 if(t==='axes'){
  const xi=div(rat(q.C),rat(q.A)),yi=div(rat(q.C),rat(q.B));
  const texts=[
   'x 軸上では、y はいくつになるかな？',
   'y = 0 を代入しよう。'+calculation(`${q.A}<i>x</i> ${q.B<0?'−':'+'} ${Math.abs(q.B)} × 0 = ${q.C}`)+calculation(`${algebraTerm(q.A,'x',true)} = ${q.C}`),
   calculation(`<i>x</i> = ${frac(xi)}　点 (${frac(xi)}, 0)`)+'次は y 軸。x はいくつになるかな？',
   'x = 0 を代入しよう。'+calculation(`${q.A} × 0 ${algebraTerm(q.B,'y')} = ${q.C}`)+calculation(`${algebraTerm(q.B,'y',true)} = ${q.C}`),
   calculation(`<i>y</i> = ${frac(yi)}　点 (0, ${frac(yi)})`)+'２つの交点を結ぶと、どんな直線？',
   '２つの交点を結ぶ直線です。自分でも２点を入力して確かめよう。'
  ];
  $('#hintText').innerHTML=texts[n-1]+((n>=3&&(xi.d!==1||yi.d!==1))?'<span class="hint-caption">分数の座標は、入力欄の「分数」で指定できます。</span>':'');
  return;
 }
 const vertical=q.kind==='vertical',fixed=vertical?'x':'y',free=vertical?'y':'x';
 if(n===1)$('#hintText').innerHTML=`${fixed} はいつも ${frac(q.k)}。${free} は変えられるかな？`;
 if(n===2)$('#hintText').innerHTML=vertical?calculation(`(${frac(q.k)}, 0) と (${frac(q.k)}, 2)`):calculation(`(0, ${frac(q.k)}) と (2, ${frac(q.k)})`);
 if(n===2)$('#hintText').innerHTML+=`この２点を結ぶと？${q.k.d!==1?' 分数は座標入力欄で指定しよう。':''}`;
 if(n===3)$('#hintText').textContent=vertical?'x が一定なので縦の直線。傾きは定義できません。':'y が一定なので横の直線。傾きは０です。';
}
function advancedVisualHint(px,py){
 const q=state.q,n=state.hintStage,t=state.hintTopic;
 const dot=p=>`<circle cx="${px(num(p[0]))}" cy="${py(num(p[1]))}" r="5" fill="#0d7f85" stroke="white" stroke-width="1.5"/>`;
 const segment=(p,r)=>`<path d="M${px(num(p[0]))} ${py(num(p[1]))}L${px(num(r[0]))} ${py(num(r[1]))}" stroke="#0d7f85" stroke-width="2.4" stroke-dasharray="5 3" fill="none"/>`;
 if(t==='axes'){
  const p=[div(rat(q.C),rat(q.A)),rat(0)],r=[rat(0),div(rat(q.C),rat(q.B))];
  return `<g class="visual-hint" aria-label="軸との交点の補助図">${n>=6?segment(p,r):''}${n>=3?dot(p):''}${n>=5?dot(r):''}</g>`;
 }
 if(t==='fixed'&&n>=2){
  const vertical=q.kind==='vertical',p=vertical?[q.k,rat(0)]:[rat(0),q.k],r=vertical?[q.k,rat(2)]:[rat(2),q.k];
  const ends=vertical?[[q.k,rat(-6)],[q.k,rat(6)]]:[[rat(-6),q.k],[rat(6),q.k]];
  return `<g class="visual-hint" aria-label="${vertical?'同じx座標の２点':'同じy座標の２点'}">${n===3?segment(...ends):''}${dot(p)}${dot(r)}</g>`;
 }
 return '';
}
document.querySelectorAll('[data-scope]').forEach(el=>el.onclick=()=>{
 if(state.scope===el.dataset.scope)return;
 state.scope=el.dataset.scope;state.advancedCount=0;state.gridlessBag=[];newQuestion();toggleSettings(false);
});
$('#includeAxis').onchange=()=>{state.includeAxis=$('#includeAxis').checked;if(state.mode==='draw'&&state.scope==='advanced')newQuestion()};


const gridlessPools={integer:[],fraction:[]};
for(const pool of Object.values(pools))for(const q of pool){
 if(q.b.d!==1||q.b.n===0)continue;
 const x=div(rat(-q.b.n),q.a);
 if(x.d!==1||Math.abs(num(x))>5)continue;
 const pts=[[x,rat(0)],[rat(0),q.b]].sort((p,r)=>num(p[0])-num(r[0]));
 gridlessPools[q.a.d===1?'integer':'fraction'].push({...q,gridless:true,pts});
}
function chooseGridlessQuestion(){
 if(!state.gridlessBag.length)state.gridlessBag=Math.random()<.5?['integer','fraction']:['fraction','integer'];
 const type=state.gridlessBag.pop();
 const pool=gridlessPools[type].filter(q=>questionKey(q)!==questionKey(state.q));
 return pool[Math.floor(Math.random()*pool.length)];
}
function paintGridlessHint(){
 const n=state.hintStage;
 $('#hintTitle').textContent='座標から傾き '+n+'/3';
 $('#hintNext').hidden=n===3;
 $('#hintNext').textContent=n===1?'補助線を見る':'変化量を見る';
 $('#hint').setAttribute('data-worked','false');
 if(n===1)$('#hintText').textContent='２点の x 座標・y 座標の差を考えよう。引く順番をそろえてね。';
 else $('#hintText').innerHTML=(n===2?'図の引き算で、横・縦の変化を求めよう。':'変化量を使って計算しよう。切片は y 軸との交点。')+'<span class="hint-formula" role="math" aria-label="傾き イコール 横の変化分の縦の変化"><span aria-hidden="true">傾き ＝</span><span class="hint-fraction" aria-hidden="true"><span>縦の変化</span><span>横の変化</span></span></span>';
}

newQuestion();
// The same actions are available to browsers that support WebMCP.
if(document.modelContext?.registerTool){try{const lifecycle=new AbortController();const result=()=>({mode:state.mode,level:state.level,question:state.count,feedback:$('#feedback').textContent});Promise.resolve(document.modelContext.registerTool({name:'start_linear_question',title:'一次関数の問題を始める',description:'指定した方向・難易度の新しい問題を表示し、現在の解答を消します。',inputSchema:{type:'object',properties:{mode:{type:'string',enum:['draw','read']},level:{type:'string',enum:['integer','fraction']}},required:['mode','level'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||!['draw','read'].includes(input.mode)||!['integer','fraction'].includes(input.level))throw Error('Invalid mode or level');setMode(input.mode,false);setLevel(input.level,false);newQuestion();return result()}},{signal:lifecycle.signal})).catch(()=>{});window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true})}catch{}}

// Keep grid units square while giving the graph all space left by the controls.
let graphLayoutFrame=0;
function fitGraphToScreen(){
 cancelAnimationFrame(graphLayoutFrame);
 graphLayoutFrame=requestAnimationFrame(()=>{
  const app=$('#app'),graph=$('.graph-box');
  const appRect=app.getBoundingClientRect(),graphRect=graph.getBoundingClientRect();
  app.style.setProperty('--hint-space',Math.max(60,graphRect.top-appRect.top-10)+'px');
  const viewportHeight=window.visualViewport?.height||window.innerHeight;
  const otherHeight=appRect.height-graphRect.height;
  const available=viewportHeight-Math.max(0,appRect.top+window.scrollY)-otherHeight-6;
  const ideal=graphRect.width*300/310;
  const height=Math.max(140,Math.min(ideal,available));
  if(Math.abs(graphRect.height-height)>.5)graph.style.height=height+'px';
 });
}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitGraphToScreen).observe($('#app'));
window.addEventListener('resize',fitGraphToScreen);
window.visualViewport?.addEventListener('resize',fitGraphToScreen);
fitGraphToScreen();
</script></body></html>
