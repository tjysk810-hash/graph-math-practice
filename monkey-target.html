<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>木の実とさかな</title><style>
*{box-sizing:border-box}body{margin:0;background:#11253a;color:#edf5fc;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}main{max-width:460px;margin:auto;padding:8px 12px max(12px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}h1{font-size:19px;margin:0}button{font:inherit;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:3px solid #ffd683;outline-offset:2px}.reset{background:#263e56;border:1px solid #506782;color:#dbe9f6;border-radius:9px;padding:7px 10px;font-size:11px}.status{display:flex;justify-content:space-between;font-size:12px;color:#b3c8db;margin-bottom:5px}.targets{display:flex;gap:7px;justify-content:center;font-size:13px;margin-bottom:6px}.target-label{background:#243d52;border-radius:8px;padding:5px 9px}.target-label.good{color:#a6f8cc}.graph{position:relative;width:100%;max-width:min(100%,calc(100dvh - 285px));min-width:220px;margin:auto}svg{display:block;width:100%;border:1px solid #44647c;border-radius:14px;background:#203c48}#hint{position:absolute;right:7px;top:7px;width:32px;height:32px;border:1px solid #668291;border-radius:50%;background:#233e53;color:#e6f3ff;font-size:18px}.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin:7px 0}.dial{width:83px;border:1px solid #557086;border-radius:12px;background:#213b52;overflow:hidden;text-align:center;touch-action:none;user-select:none}.dial button{width:100%;height:26px;border:0;background:#2b465e;color:#c3d8e8;font-size:17px}.dial label{display:block;font-size:11px;color:#b7cfde;padding-top:3px}.dial .value{display:flex;align-items:center;justify-content:center;height:42px;font-family:Georgia,serif;font-size:27px;color:#fff}.math{font-family:Georgia,serif;font-size:25px;font-style:italic}.frac{display:inline-flex;flex-direction:column;align-items:center;font-size:.68em;line-height:1.05}.frac span:first-child{border-bottom:1px solid;padding:0 3px 2px}.frac span:last-child{padding-top:2px}#fire{display:block;width:100%;min-height:44px;border:0;border-radius:11px;background:#ffca70;color:#213345;font-weight:700;font-size:16px}#fire:disabled{opacity:.5}#feedback{min-height:37px;line-height:1.5;font-size:12px;margin:6px 0;color:#d8e7f2}.beam{stroke-dasharray:600;stroke-dashoffset:600;animation:shoot .4s ease-out forwards}@keyframes shoot{to{stroke-dashoffset:0}}.help{position:absolute;top:43px;right:6px;left:6px;border:1px solid #7f9bb0;background:#f3f8ff;color:#19334b;border-radius:10px;padding:10px;font-size:13px;line-height:1.6;z-index:2}[hidden]{display:none!important}.small{font-size:10px;text-align:center;color:#9fb9cc;margin:4px 0 0}@media(prefers-reduced-motion:reduce){.beam{animation:none;stroke-dashoffset:0}}
.header-actions{display:flex;gap:5px}@media(max-width:350px){h1{font-size:17px}.reset{padding:7px;font-size:10px}}</style></head><body><main><header><h1>木の実とさかな</h1><div class="header-actions"><button id="sound" class="reset" aria-pressed="true">音 ON</button><button id="reset" class="reset">はじめから</button></div></header><div class="status"><span>１本の弾道で２つをねらおう</span><span id="progress"></span></div><div id="targets" class="targets"></div><div class="graph"><svg id="graph" viewBox="0 0 380 380" role="img"></svg><button id="hint" aria-label="ヒント">？</button><div id="help" class="help" hidden></div></div><div class="controls"><span class="math">y =</span><div class="dial" id="dialA" role="spinbutton" tabindex="0" aria-label="傾き a" aria-valuemin="-2" aria-valuemax="2"><button id="upA" aria-label="傾きを大きくする">▲</button><label>向き a</label><div class="value" id="valueA"></div><button id="downA" aria-label="傾きを小さくする">▼</button></div><span class="math">x +</span><div class="dial" id="dialB" role="spinbutton" tabindex="0" aria-label="切片 b" aria-valuemin="-5" aria-valuemax="5"><button id="upB" aria-label="高さを上げる">▲</button><label>高さ b</label><div class="value" id="valueB"></div><button id="downB" aria-label="高さを下げる">▼</button></div></div><button id="fire">発射</button><p id="feedback" role="status" aria-live="polite"></p><p class="small">ダイヤルを上下にスワイプ、または ▲ ▼ で調整</p></main><script>
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const slopes=[[-2,1],[-5,3],[-3,2],[-4,3],[-1,1],[-2,3],[-1,2],[-1,3],[0,1],[1,3],[1,2],[2,3],[1,1],[4,3],[3,2],[5,3],[2,1]];
let ai=8,b=0,round=0,solved=false,busy=false,shot=null,hitFlags=[false,false],q,history=[],timer=0,anim=0,visualA=0,visualB=0,flightFrame=0,flightX=0;
const X=x=>34+x*26,Y=y=>188-y*26;
function node(tag,attr={},text=''){const n=document.createElementNS(NS,tag);Object.entries(attr).forEach(([k,v])=>n.setAttribute(k,v));n.textContent=text;return n}function put(tag,attr,text){const n=node(tag,attr,text);$('graph').append(n);return n}
function line(x1,y1,x2,y2,attr={}){return put('line',{x1:X(x1),y1:Y(y1),x2:X(x2),y2:Y(y2),...attr})}
function rational(pair){const[n,d]=pair;return d===1?String(n):`${n<0?'−':''}<span class="frac"><span>${Math.abs(n)}</span><span>${d}</span></span>`}
function segment(a,c){const pts=[];for(const x of [0,12]){const y=a*x+c;if(y>=-6&&y<=6)pts.push([x,y])}if(a!==0)for(const y of [-6,6]){const x=(y-c)/a;if(x>=0&&x<=12&&!pts.some(p=>Math.abs(p[0]-x)<1e-8))pts.push([x,y])}return pts}
function render(){const g=$('graph');g.replaceChildren();put('rect',{x:34,y:32,width:312,height:156,fill:'#b3d98a'});put('rect',{x:34,y:188,width:312,height:156,fill:'#80d9ed'});
 for(let x=1;x<=12;x++){line(x,-6,x,6,{stroke:'#315c68',opacity:.24});put('text',{x:X(x),y:202,fill:'#173d52','font-size':9,'text-anchor':'middle'},x)}for(let y=-6;y<=6;y++){line(0,y,12,y,{stroke:'#315c68',opacity:.24});if(y)put('text',{x:23,y:Y(y)+3,fill:'#173d52','font-size':10,'text-anchor':'end'},y)}
 put('rect',{x:29,y:20,width:10,height:330,rx:4,fill:'#936c4d',opacity:.9});line(0,-6.2,0,6.3,{stroke:'#e1ddc6','stroke-width':1});line(0,0,12.4,0,{stroke:'#e7fbff','stroke-width':2});put('text',{x:358,y:185,fill:'#eef5ff','font-size':14},'x');put('text',{x:29,y:15,fill:'#eef5ff','font-size':14},'y');put('text',{x:22,y:202,fill:'#e1eafa','font-size':10},'0');
 if(shot){const pts=segment(shot.a,shot.b);if(pts.length>=2){const end=busy?[flightX,shot.a*flightX+shot.b]:pts[1];line(...pts[0],...end,{stroke:'#b4404d','stroke-width':2,opacity:.8})}}
 q.points.forEach((p,i)=>{const x=X(p.x),y=Y(p.y),color=p.y<0?(i%2?'#c53ac3':'#ff8b27'):(i%2?'#ffcc35':'#ef4650');if(p.y<0){put('ellipse',{cx:x,cy:y,rx:10,ry:6,fill:color});put('polygon',{points:`${x-8},${y} ${x-16},${y-7} ${x-16},${y+7}`,fill:color});put('path',{d:`M ${x-4} ${y-5} l 2 10 M ${x+1} ${y-5} l 2 10`,stroke:'#fff6bd','stroke-width':2,fill:'none'});put('circle',{cx:x+5,cy:y-1,r:1.5,fill:'#1c3551'})}else{put('circle',{cx:x,cy:y,r:8,fill:color});put('path',{d:`M ${x} ${y-7} q 0 -8 7 -7`,fill:'none',stroke:'#b1da8e','stroke-width':2})}if(hitFlags[i]){put('circle',{cx:x,cy:y,r:15,fill:'none',stroke:'#fff','stroke-width':3});put('text',{x:x,y:y+4,'text-anchor':'middle',fill:'#143b43','font-size':14,'font-weight':700},'✓')}put('text',{x:x+(p.x>9?-13:13),y:y+(p.y>=4?18:-12),fill:'#173549','font-size':11,'font-weight':700,'text-anchor':p.x>9?'end':'start'},`(${p.x}, ${p.y})`)});
 const d=1.6/Math.hypot(1,visualA);if(!solved)line(0,visualB,d,visualB+visualA*d,{stroke:'#a64046','stroke-dasharray':'3 4','stroke-width':1.5});
 const monkey=put('g',{transform:`translate(${X(0)} ${Y(visualB)})`});monkey.append(node('circle',{cx:-7,cy:7,r:9,fill:'#a47a53'}));for(const cx of [-10,10])monkey.append(node('circle',{cx,cy:-6,r:5,fill:'#b98a60'}));monkey.append(node('circle',{cx:0,cy:-6,r:10,fill:'#bb8d63'}));monkey.append(node('ellipse',{cx:0,cy:-4,rx:7,ry:6,fill:'#f0d2a0'}));for(const cx of [-3,3])monkey.append(node('circle',{cx,cy:-7,r:1.2,fill:'#233744'}));if(visualB<0)monkey.append(node('rect',{x:-8,y:-11,width:16,height:8,rx:3,fill:'#75d7ed',stroke:'#effaff','stroke-width':1,opacity:.85}));const gun=node('g',{transform:`rotate(${-Math.atan(visualA)*180/Math.PI})`});gun.append(node('rect',{x:4,y:-3,width:21,height:6,rx:2,fill:'#d3e3f1'}));gun.append(node('rect',{x:8,y:2,width:5,height:7,rx:1,fill:'#91a9bd'}));monkey.append(gun);
 if(busy&&shot){put('circle',{cx:X(flightX),cy:Y(shot.a*flightX+shot.b),r:6,fill:'#fff9c4',stroke:'#ce374a','stroke-width':2});}
 g.setAttribute('aria-label',`横軸0から12、縦軸マイナス6から6。目標 ${q.points.map(p=>`(${p.x},${p.y})`).join('と')}。`);
}
let soundEnabled=true,audio=null,audioBus=null,activeSounds=[];
function soundEffect(kind,water=false,direction=1,delay=0){if(!soundEnabled)return;try{
 const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
 if(!audio){audio=new Audio();audioBus=audio.createGain();audioBus.gain.value=.65;audioBus.connect(audio.destination)}audio.resume().catch(()=>{});
 const t=audio.currentTime+delay;
 function tone(freq,end,offset,duration,volume,type='sine'){
 const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(freq,t+offset);o.frequency.exponentialRampToValueAtTime(end,t+offset+duration);f.type='lowpass';f.frequency.value=water?1100:4500;g.gain.setValueAtTime(.0001,t+offset);g.gain.exponentialRampToValueAtTime(volume,t+offset+.008);g.gain.exponentialRampToValueAtTime(.0001,t+offset+duration);o.connect(f);f.connect(g);g.connect(audioBus);activeSounds.push(o);o.onended=()=>{activeSounds=activeSounds.filter(n=>n!==o);o.disconnect();f.disconnect();g.disconnect()};o.start(t+offset);o.stop(t+offset+duration+.015);
 }
 if(kind==='move'){for(let i=0;i<2;i++)if(water)tone(direction>0?230:420,direction>0?520:190,i*.13,.13,.10);else tone(direction>0?420+i*110:530-i*110,180,i*.13,.075,.075,'triangle')}
 if(kind==='splash'){for(let i=0;i<3;i++)tone(600-i*110,140+i*30,i*.055,.16,.075)}
 if(kind==='fire'){if(water){tone(250,70,0,.23,.18);tone(480,170,.06,.19,.08)}else{tone(1000,100,0,.14,.14,'triangle');tone(220,60,0,.09,.10)}}
 if(kind==='hit'){if(water){tone(300,800,0,.14,.12);tone(650,260,.08,.17,.09)}else{tone(1100,680,0,.10,.12,'triangle');tone(1500,950,.07,.16,.07)}}
 if(kind==='clear'){[660,880,1320].forEach((f,i)=>tone(f,f,i*.08,.23,.07))}
 }catch(e){/* 音声が使えない環境でもゲームを続ける */}}
function stopSounds(){for(const o of activeSounds){try{o.stop()}catch(e){}}activeSounds=[]}
$('sound').onclick=()=>{soundEnabled=!soundEnabled;if(!soundEnabled)stopSounds();$('sound').textContent=soundEnabled?'音 ON':'音 OFF';$('sound').setAttribute('aria-pressed',String(soundEnabled))};
function updateControls(){const a=slopes[ai][0]/slopes[ai][1];$('valueA').innerHTML=rational(slopes[ai]);$('valueB').textContent=b;for(const[id,v,text]of[['dialA',a,slopes[ai].join('/')],['dialB',b,String(b)]]){$(id).setAttribute('aria-valuenow',v);$(id).setAttribute('aria-valuetext',text)}$('upA').disabled=busy||solved||ai===16;$('downA').disabled=busy||solved||ai===0;$('upB').disabled=busy||solved||b===5;$('downB').disabled=busy||solved||b===-5}
function change(which,step){if(busy||solved)return;const oldB=b;if(which==='A')ai=Math.max(0,Math.min(16,ai+step));else b=Math.max(-5,Math.min(5,b+step));if(which==='B'&&b!==oldB){if((oldB<0)!==(b<0))soundEffect('splash',true);else soundEffect('move',b<0,Math.sign(b-oldB))}updateControls();cancelAnimationFrame(anim);const start=performance.now(),fromA=visualA,fromB=visualB,toA=slopes[ai][0]/slopes[ai][1];$('fire').disabled=true;function frame(t){const p=Math.min(1,(t-start)/400),e=p*p*(3-2*p);visualA=fromA+(toA-fromA)*e;visualB=fromB+(b-fromB)*e;render();if(p<1)anim=requestAnimationFrame(frame);else{$('fire').disabled=false;anim=0}}anim=requestAnimationFrame(frame)}
const pool=[];slopes.forEach(([n,d],i)=>{for(let c=-5;c<=5;c++){const pts=[];for(let x=1;x<=11;x++){const y=n*x/d+c;if(Number.isInteger(y)&&Math.abs(y)<=5&&y!==0)pts.push({x,y})}for(let j=0;j<pts.length;j++)for(let k=j+1;k<pts.length;k++)if(pts[k].x-pts[j].x>=2)pool.push({ai:i,a:n/d,b:c,points:[pts[j],pts[k]]})}});
function newQuestion(){cancelAnimationFrame(flightFrame);flightFrame=0;stopSounds();clearTimeout(timer);cancelAnimationFrame(anim);anim=0;ai=8;b=0;visualA=visualB=0;solved=busy=false;shot=null;hitFlags=[false,false];const slopeChoices=[...new Set(pool.map(p=>p.ai))];const chosen=slopeChoices[Math.floor(Math.random()*slopeChoices.length)];const candidates=pool.filter(p=>p.ai===chosen&&!history.includes(JSON.stringify(p)));q=(candidates.length?candidates:pool)[Math.floor(Math.random()*(candidates.length||pool.length))];history.push(JSON.stringify(q));$('progress').textContent=`${round+1} / 5`;$('targets').innerHTML=q.points.map((p,i)=>`<span class="target-label">${p.y<0?'魚':'木の実'} ${i+1}（${p.x}, ${p.y}）</span>`).join('');$('feedback').textContent='aで向き、bで高さを変えて、２つをねらおう。';$('fire').textContent='発射';$('fire').disabled=false;$('help').hidden=true;updateControls();render()}
function shoot(){if(busy||anim)return;if(solved){round=(round+1)%5;newQuestion();return}busy=true;hitFlags=[false,false];flightX=0;soundEffect('fire',b<0);updateControls();$('fire').disabled=true;const a=slopes[ai][0]/slopes[ai][1];shot={a,b};const pts=segment(a,b),endX=pts[1][0],start=performance.now(),duration=Math.max(650,Math.hypot(endX,a*endX)*95);
 $('feedback').textContent='弾道を見てみよう。';
 function fly(now){const fraction=Math.min(1,(now-start)/duration);flightX=endX*fraction;
 q.points.forEach((p,i)=>{if(!hitFlags[i]&&flightX>=p.x&&Math.abs(a*p.x+b-p.y)<1e-8){hitFlags[i]=true;soundEffect('hit',p.y<0);$('feedback').textContent=`${hitFlags.filter(Boolean).length}個命中！`;}});
 if(fraction<1){render();flightFrame=requestAnimationFrame(fly);return}
 flightFrame=0;solved=hitFlags.every(Boolean);busy=false;if(solved)soundEffect('clear',false,1,.18);render();updateControls();$('fire').disabled=false;$('feedback').textContent=solved?'２つとも命中！ この直線が２つの座標を通る式だね。':hitFlags.some(Boolean)?'１つ命中！ もう１つも通るように、向きと高さを調整しよう。':'惜しい！ 弾道と的を見比べて、向きや高さを調整しよう。';$('fire').textContent=solved?(round===4?'５問クリア！ もう一度':'次の的へ'):'もう一度発射';}
 flightFrame=requestAnimationFrame(fly);
}
for(const w of ['A','B']){$('up'+w).onclick=()=>change(w,1);$('down'+w).onclick=()=>change(w,-1);const dial=$('dial'+w);let startY=null;dial.onpointerdown=e=>{if(e.target.tagName==='BUTTON')return;startY=e.clientY;dial.setPointerCapture(e.pointerId)};dial.onpointermove=e=>{if(startY===null)return;const delta=startY-e.clientY;if(Math.abs(delta)>=24){change(w,Math.sign(delta));startY=e.clientY}};dial.onpointerup=dial.onpointercancel=()=>{startY=null};dial.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();change(w,e.key==='ArrowUp'?1:-1)}}}
$('fire').onclick=shoot;$('reset').onclick=()=>{round=0;history=[];newQuestion()};$('hint').onclick=()=>{$('help').hidden=!$('help').hidden;$('help').textContent='a は「縦の変化 ÷ 横の変化」。b は水面からの発射位置。まず２つの的を結ぶ向きを考えよう。'};newQuestion();
</script></body></html>
