<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f6fc"><title>比例の式とグラフ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#182744;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;border:0;border-radius:9px;color:inherit;min-height:42px}button:focus-visible,input:focus-visible{outline:3px solid #eab52c}button:disabled{opacity:.5}[hidden]{display:none!important}main{max-width:470px;margin:auto;padding:10px 12px}header{display:flex;align-items:center;justify-content:space-between;height:38px}h1{font-size:19px;margin:0}.quiet{background:transparent;color:#2c52cc;font-size:13px}.modes{display:flex;background:#e3eaf6;border-radius:10px;padding:3px;margin:5px 0}.modes button{flex:1;background:transparent;font-size:14px;min-height:34px}.modes [aria-pressed=true]{background:white;color:#2c52cc;font-weight:700}.question{font-size:13px;min-height:33px;display:flex;align-items:center;gap:8px}.question b{color:#2c52cc}#plot{position:relative;margin:0 -12px;background:white;border-block:1px solid #dbe2ef;height:min(94vw,410px)}svg{width:100%;height:100%;display:block;touch-action:manipulation}#hintButton{position:absolute;top:5px;left:6px;border:1px solid #dbe2ef;border-radius:50%;width:32px;min-height:32px;background:#eef3ff;color:#2c52cc;font-size:20px}#problem{background:#eaf0ff;margin:0 -12px 12px;padding:9px 15px;display:flex;align-items:center;justify-content:space-between;min-height:58px}#problem small{color:#59677e}#coordinate{font-size:26px;font-family:Georgia,serif}#refresh{min-height:28px;padding:2px 8px;border:1px solid #cbd5e8;background:white;color:#2c52cc;font-size:12px}.meta{display:flex;flex-direction:column;gap:4px}.answer{display:flex;gap:7px;align-items:center}.answer span{font-size:23px}.answer input{min-width:0;width:100%;height:44px;border:1px solid #cbd5e8;border-radius:9px;text-align:center;background:white;color:#182744;font-size:19px}.answer input.active{border:2px solid #2c52cc}.minus{flex:0 0 35px;background:#e6edf8;font-size:24px}.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:7px}.keypad button{background:white;border:1px solid #dbe2ef;font-size:21px;min-height:39px}.keypad button:last-child{font-size:12px}#feedback{min-height:47px;display:flex;align-items:center;font-size:14px;line-height:1.5;padding:6px 0;color:#59677e}#feedback.error{color:#ad302c}#feedback.success{color:#08767c;font-weight:bold}footer{display:flex;gap:8px}footer button{padding:8px 14px}#reset{background:white;border:1px solid #cbd5e8}#check,#next{flex:1;background:#2c52cc;color:white;font-weight:bold}.note{font-size:11px;color:#59677e;margin:10px 0}#hint{position:absolute;z-index:3;top:6px;left:10px;right:10px;background:white;border:1px solid #a7bcef;box-shadow:0 3px 15px #17305520;border-radius:12px;padding:8px 10px;max-height:110px;overflow:auto}main{position:relative}.hint-head{display:flex;align-items:center;gap:4px;font-size:13px}.hint-head b{margin-right:auto}.hint-head button{min-height:28px}#hintText{font-size:14px;line-height:1.5;margin:3px 0}#settings{position:absolute;top:48px;left:10px;right:10px;z-index:4;background:white;border:1px solid #cad5ea;border-radius:12px;padding:12px;box-shadow:0 5px 20px #17305520}#settings p{font-size:12px;line-height:1.7;color:#59677e}.options{display:flex;gap:5px}.options button{flex:1;background:#f3f6fc;font-size:13px}.options [aria-pressed=true]{background:#e1eaff;color:#2c52cc;border:1px solid #2c52cc}@media(max-height:700px){main{padding-top:4px}.note{display:none}#feedback{min-height:38px}}

#pointControls button{width:38px;flex-shrink:0}#pointControls [aria-pressed=true]{background:#dce7ff;color:#2c52cc;border-bottom:3px solid #2c52cc}#pointInfo{font-size:13px;color:#59677e}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.15;margin:0 4px}.frac span:first-child{border-bottom:1.5px solid;padding:0 4px 3px}.frac span:last-child{padding:3px 4px 0}#fraction{font-size:12px;flex:0 0 39px}#answer label{white-space:nowrap;font-size:22px;font-family:Georgia,serif}#coordinate{font-size:27px}.answer{min-height:44px}#hint{max-height:112px}
</style></head><body><main id="app"><header><h1>比例の式とグラフ</h1><button id="settingsButton" class="quiet" aria-expanded="false">設定 ≫</button></header><section id="settings" hidden><div class="hint-head"><b>比例定数</b><button id="closeSettings" class="quiet">閉じる</button></div><div class="options"><button data-set="integer" aria-pressed="true">整数</button><button data-set="fraction" aria-pressed="false">分数あり</button></div><p>負の比例定数も出題します。分数ありでは比例定数が分数になります。点は整数の座標に打てます。</p></section><nav class="modes" aria-label="問題の種類"><button data-mode="plot" aria-pressed="true">式からグラフ</button><button data-mode="read" aria-pressed="false">グラフから式</button></nav><div class="question"><b id="number">01</b><span id="instruction"></span></div><section id="plot" aria-label="座標平面"><svg id="graph" viewBox="0 0 340 340" role="group" aria-label="座標平面"></svg><button id="hintButton" aria-label="ヒントを表示" aria-expanded="false">?</button></section><section id="problem"><div class="meta"><small id="problemLabel"></small><button id="refresh">更新</button></div><div id="coordinate"></div></section><section id="pointControls" class="answer"><button data-point="0" aria-pressed="true">A</button><button data-point="1" aria-pressed="false">B</button><span id="pointInfo"></span></section><section id="answer" class="answer" aria-label="比例定数の入力" hidden><button id="minus" class="minus" aria-label="比例定数の符号を変える">−</button><button id="fraction" aria-label="比例定数を分数で入力">分数</button><label for="a"><i>a</i>＝</label><input id="a" readonly inputmode="none" placeholder="a" aria-label="比例定数 a"></section><section id="keypad" class="keypad" aria-label="数字入力" hidden></section><div id="feedback" role="status" aria-live="polite"></div><footer><button id="reset">やり直す</button><button id="check">答えを確かめる</button><button id="next" hidden>次の問題</button></footer><p class="note">計算は紙で。比例のグラフは原点を通る直線。</p><aside id="hint" hidden><div class="hint-head"><b id="hintTitle"></b><button id="hintNext" class="quiet">次のヒント</button><button id="closeHint" class="quiet" aria-label="ヒントを閉じる">×</button></div><p id="hintText"></p></aside></main><script>'use strict';
const $=s=>document.querySelector(s),state={mode:'plot',set:'integer',q:null,points:[null,null],target:0,value:'',active:false,solved:false,hint:0,count:0};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function rational(n,d=1){if(!d)throw Error('分母は 0 にできません。');if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}}
function parse(s){if(!/^-?\d{1,3}(\/\d{1,3})?$/.test(s))throw Error('比例定数 a を整数か分数で入力しよう。');const[n,d=1]=s.split('/').map(Number);return rational(n,d)}
function fraction(a){return(a.n<0?'−':'')+(a.d===1?Math.abs(a.n):`<span class="frac"><span>${Math.abs(a.n)}</span><span>${a.d}</span></span>`)}
function formula(a){return `<i>y</i> = ${Math.abs(a.n)===a.d?(a.n<0?'−':''):fraction(a)}<i>x</i>`}
const pools={integer:[-3,-2,-1,1,2,3].map(n=>rational(n)),fraction:[[-1,2],[1,2],[-3,2],[3,2],[-1,3],[1,3],[-2,3],[2,3]].map(([n,d])=>rational(n,d))};
function makeQuestion(a,sign=1){return{a,point:[sign*a.d,sign*a.n]}}
function newQuestion(){const pool=pools[state.set];let a=pool[Math.floor(Math.random()*pool.length)];if(state.q&&a.n===state.q.a.n&&a.d===state.q.a.d)a=pool[(pool.indexOf(a)+1)%pool.length];state.q=makeQuestion(a,Math.random()<.5?-1:1);state.count++;$('#number').textContent=String(state.count).padStart(2,'0');reset()}
function message(t,c=''){$('#feedback').textContent=t;$('#feedback').className=c}
function closeInput(){state.active=false;$('#keypad').hidden=true;$('#a').classList.remove('active');fit()}
function hideHint(){state.hint=0;$('#hint').hidden=true;$('#hintButton').setAttribute('aria-expanded','false')}
function reset(){state.points=[null,null];state.target=0;state.value='';state.solved=false;hideHint();closeInput();$('#a').value='';$('#a').disabled=false;$('#minus').disabled=false;$('#fraction').disabled=false;$('#check').hidden=false;$('#next').hidden=true;$('#answer').hidden=state.mode!=='read';$('#pointControls').hidden=state.mode!=='plot';$('#instruction').textContent=state.mode==='plot'?'原点ともう１点で、直線を描こう。':'点の座標から、比例定数を求めよう。';$('#problemLabel').textContent=state.mode==='plot'?'問題の式':'答えの式';renderEquation();selectPoint(0);message(state.mode==='plot'?'まず原点を打とう。次に式に合うもう１点。':'紙で a を求めて入力しよう。');draw();fit()}
function renderEquation(){if(state.mode==='plot')$('#coordinate').innerHTML=formula(state.q.a);else{let a;try{a=parse(state.value)}catch{}$('#coordinate').innerHTML=a?formula(a):'<i>y</i> = <i>a x</i>'}}
function selectPoint(i){state.target=i;document.querySelectorAll('[data-point]').forEach(e=>e.setAttribute('aria-pressed',String(Number(e.dataset.point)===i)));$('#pointInfo').textContent=state.points.map((p,j)=>`${j?'B':'A'} ${p?'('+p.join(', ')+')':'未入力'}`).join('　')}
const px=x=>170+26*x,py=y=>170-26*y;
function onLine(p){return p[1]*state.q.a.d===p[0]*state.q.a.n}
function draw(){let s='<defs><clipPath id="clip"><rect x="40" y="40" width="260" height="260"/></clipPath></defs>';for(let i=-5;i<=5;i++){s+=`<path d="M${px(i)} 40V300 M40 ${py(i)}H300" stroke="#e2e9f3"/>`;if(i)s+=`<text x="${px(i)}" y="185" text-anchor="middle">${i}</text><text x="160" y="${py(i)+4}" text-anchor="end">${i}</text>`}s='<g fill="#65768f" font-size="11">'+s+'</g><path d="M30 170H324m-7-5 7 5-7 5 M170 310V20m-5 7 5-7 5 7" fill="none" stroke="#6c809e" stroke-width="1.5"/><text x="327" y="174" font-size="15">x</text><text x="178" y="24" font-size="15">y</text><text x="156" y="185" font-size="11">0</text>';
const points=state.mode==='read'?[[0,0],state.q.point]:state.points;
if(state.mode==='read'||(points.every(Boolean)&&(points[0][0]!==points[1][0]||points[0][1]!==points[1][1]))){const[p,r]=points;let path;if(p[0]===r[0])path=`M${px(p[0])} 40V300`;else{const a=(r[1]-p[1])/(r[0]-p[0]),b=p[1]-a*p[0];path=`M${px(-5)} ${py(-5*a+b)}L${px(5)} ${py(5*a+b)}`}s+=`<path d="${path}" fill="none" stroke="#2c52cc" stroke-width="2.5" clip-path="url(#clip)"/>`}
if(state.hint>=2){if(state.mode==='plot'){const a=state.q.a;s+=state.hint===2?'<circle cx="170" cy="170" r="10" fill="none" stroke="#07857f" stroke-width="2"/>':`<path d="M170 170H${px(a.d)}V${py(a.n)}" stroke="#07857f" stroke-width="2" stroke-dasharray="5 3" fill="none"/><circle cx="${px(a.d)}" cy="${py(a.n)}" r="8" fill="none" stroke="#07857f" stroke-width="2"/>`}else{const[x,y]=state.q.point;s+=`<path d="M${px(x)} 170V${py(y)}H170" fill="none" stroke="#07857f" stroke-width="1.5" stroke-dasharray="4 3"/>`}}
points.forEach((p,i)=>{if(!p)return;s+=`<circle cx="${px(p[0])}" cy="${py(p[1])}" r="5" fill="${state.solved?'#08767c':'#2c52cc'}" stroke="white" stroke-width="2"/><text x="${px(p[0])+9}" y="${py(p[1])-10}" fill="#2c52cc" font-size="${state.mode==='read'?12:15}" font-weight="bold" stroke="white" stroke-width="3" paint-order="stroke">${state.mode==='read'?(i?'('+p.join(', ')+')':''):i?'B':'A'}</text>`});$('#graph').innerHTML=s}
function activate(){if(state.solved)return;state.active=true;$('#keypad').hidden=false;$('#a').classList.add('active');fit()}
function edit(k){if(state.solved)return;if(!state.active)activate();let v=state.value;if(k==='minus')v=v.startsWith('-')?v.slice(1):'-'+v;else if(k==='fraction'){if(v&&v!=='-'&&!v.includes('/'))v+='/'}else if(k==='back')v=v.slice(0,-1);else if(k==='clear')v='';else if(/^\d$/.test(k)&&v.length<8)v+=k;state.value=v;$('#a').value=v;renderEquation();message('入力できたら「答えを確かめる」を押そう。')}
function check(){if(state.solved)return;closeInput();if(state.mode==='plot'){const ps=state.points;if(!ps.every(Boolean)){message('原点ともう１点、２つの点を打とう。','error');return}if(ps[0][0]===ps[1][0]&&ps[0][1]===ps[1][1]){message('異なる２点を打とう。','error');return}if(!ps.some(p=>p[0]===0&&p[1]===0)){message('比例のグラフは原点を通ります。１点は原点に置こう。','error');return}if(!ps.every(onLine)){message('もう１点の座標を式に代入して、y の値を確かめよう。','error');return}}else{try{const a=parse(state.value);if(a.n!==state.q.a.n||a.d!==state.q.a.d){message('原点以外の点で、y ÷ x を計算しよう。符号にも注意。','error');return}}catch(e){message(e.message,'error');return}}
state.solved=true;hideHint();$('#check').hidden=true;$('#next').hidden=false;$('#a').disabled=true;$('#minus').disabled=true;$('#fraction').disabled=true;message('正解！ 比例の式とグラフがつながりました。','success');draw();fit()}
function place(x,y){if(state.mode!=='plot'||state.solved)return;state.points[state.target]=[x,y];const other=1-state.target;selectPoint(state.points[other]?state.target:other);draw();message(state.points.every(Boolean)?'２点を結びました。グラフを確かめよう。':'次はもう１点。点を直すときは A・B を選ぼう。')}
$('#graph').onclick=e=>{const svg=$('#graph'),m=svg.getScreenCTM();if(!m)return;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const r=p.matrixTransform(m.inverse());if(r.x<30||r.x>310||r.y<30||r.y>310)return;place(Math.max(-5,Math.min(5,Math.round((r.x-170)/26))),Math.max(-5,Math.min(5,Math.round((170-r.y)/26))))};
function showHint(){state.hint=Math.min(3,state.hint+1);$('#hint').hidden=false;$('#hintButton').setAttribute('aria-expanded','true');$('#hintTitle').textContent=`ヒント ${state.hint}/3`;$('#hintNext').hidden=state.hint===3;const a=state.q.a,[x,y]=state.q.point;$('#hintText').innerHTML=state.mode==='plot'?(state.hint===1?'比例のグラフは原点を通ります。x = 0 のとき、y は？':state.hint===2?'まず (0, 0) に点を打とう。もう１点は、x に数を代入して y を求めよう。':`例えば x = ${a.d} のとき y = ${a.n}。原点から右へ ${a.d}、${a.n>0?'上':'下'}へ ${Math.abs(a.n)} の点です。`):(state.hint===1?'比例の式は y = ax。原点以外の点の x、y を使おう。':state.hint===2?'比例定数は <span class="frac"><span>y</span><span>x</span></span>。縦の座標を、横の座標で割ろう。':`a = <span class="frac"><span>${y}</span><span>${x}</span></span>。約分と符号を確かめて入力しよう。`);draw()}
function settings(open){$('#settings').hidden=!open;$('#settingsButton').setAttribute('aria-expanded',String(open));if(open){hideHint();draw()}}
$('#settingsButton').onclick=()=>settings($('#settings').hidden);$('#closeSettings').onclick=()=>settings(false);document.querySelectorAll('[data-set]').forEach(e=>e.onclick=()=>{state.set=e.dataset.set;document.querySelectorAll('[data-set]').forEach(b=>b.setAttribute('aria-pressed',String(b===e)));settings(false);newQuestion()});document.querySelectorAll('[data-mode]').forEach(e=>e.onclick=()=>{if(state.mode===e.dataset.mode)return;state.mode=e.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===e)));settings(false);newQuestion()});document.querySelectorAll('[data-point]').forEach(e=>e.onclick=()=>{if(!state.solved){selectPoint(Number(e.dataset.point));message(`次のタップで点${state.target?'B':'A'}を置き直します。`)}});
$('#a').onclick=activate;$('#a').onfocus=activate;$('#minus').onclick=()=>edit('minus');$('#fraction').onclick=()=>edit('fraction');$('#check').onclick=check;$('#next').onclick=newQuestion;$('#reset').onclick=reset;$('#refresh').onclick=newQuestion;$('#hintButton').onclick=showHint;$('#hintNext').onclick=showHint;$('#closeHint').onclick=()=>{hideHint();draw()};
$('#keypad').innerHTML=['1','2','3','4','5','back','6','7','8','9','0','clear'].map(k=>`<button data-key="${k}" aria-label="${k==='back'?'１文字削除':k==='clear'?'入力を消す':k}">${k==='back'?'⌫':k==='clear'?'消す':k}</button>`).join('');document.querySelectorAll('[data-key]').forEach(e=>e.onclick=()=>edit(e.dataset.key));document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeInput();hideHint();settings(false);draw();return}if(!state.active)return;if(e.key==='Enter'){e.preventDefault();check()}else if(/^\d$/.test(e.key)||['-','/','Backspace','Delete'].includes(e.key)){e.preventDefault();edit(e.key==='-'?'minus':e.key==='/'?'fraction':e.key==='Backspace'?'back':e.key==='Delete'?'clear':e.key)}});
let frame=0;function fit(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{const app=$('#app').getBoundingClientRect(),plot=$('#plot'),r=plot.getBoundingClientRect(),h=Math.max(150,Math.min(r.width,(window.visualViewport?.height||window.innerHeight)-(app.height-r.height)-14));if(Math.abs(r.height-h)>.5)plot.style.height=h+'px'})}window.addEventListener('resize',fit);window.visualViewport?.addEventListener('resize',fit);newQuestion();
</script></body></html>
