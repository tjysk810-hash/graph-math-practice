<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>代入して a を求めよう</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#1c2f50;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}main{max-width:450px;margin:auto;padding:18px 14px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:20px;margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #efab28;outline-offset:2px}.quiet{padding:8px;border:1px solid #ced8ed;border-radius:10px;background:white;color:#385780;font-size:12px}.prompt{font-size:15px;line-height:1.8;margin:18px 0 12px}.step{font-size:13px;color:#3158cc;font-weight:700}.equation{display:flex;justify-content:center;align-items:center;gap:8px;padding:26px 8px;background:white;border:1px solid #d5dff0;border-radius:18px;font-family:Georgia,serif;font-size:30px;margin:10px 0}.slot{display:flex;align-items:center;justify-content:center;width:64px;height:72px;border:2px dashed #b6c5e1;border-radius:12px;font-style:italic;background:#f3f7ff}.slot.over{background:#fff1c9;border-color:#d79408;transform:scale(1.05)}.slot.filled{border:2px solid #70b9b4;background:#e7f6f3;font-style:normal}.slot.pop{animation:pop .5s}@keyframes pop{50%{transform:scale(1.17);background:#c3eee5}}.conditions{display:flex;justify-content:center;gap:24px;padding:24px 0}.condition{display:flex;align-items:center;gap:8px;font:24px Georgia,serif}.card{display:flex;justify-content:center;align-items:center;min-width:62px;height:62px;background:#3057cd;color:white;border:2px solid #2547b1;border-radius:12px;font:700 27px Georgia,serif;touch-action:none;user-select:none;cursor:grab;box-shadow:0 4px 0 #203f9c}.card.used{opacity:.35;box-shadow:none;cursor:default}.ghost{position:fixed;z-index:10;pointer-events:none;margin:0;box-shadow:0 8px 20px #13294b55;transform:scale(1.08)}.note{font-size:13px;color:#5c6e88;line-height:1.7;text-align:center;margin:0 0 16px}.answer{display:flex;align-items:center;justify-content:center;gap:12px;font:28px Georgia,serif;margin:14px 0}.answer output{display:flex;align-items:center;justify-content:center;min-width:92px;height:55px;border:2px solid #3158cc;border-radius:10px;background:white;font:25px sans-serif}.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.keys button{height:47px;background:white;color:#20395e;border:1px solid #ced9ec;border-radius:10px;font-size:22px}.keys button:disabled{opacity:.4}.action{width:100%;border:0;border-radius:12px;min-height:48px;background:#3057cd;color:white;font-weight:700;font-size:16px}.action:disabled{background:#cdd6e7;color:#60748f}#message{min-height:48px;font-size:14px;line-height:1.6;margin:12px 0;color:#315070}.foot{display:flex;justify-content:space-between;margin-top:12px}.success{color:#087c71!important}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:350px){h1{font-size:18px}.equation{gap:6px}.slot{width:58px}.conditions{padding:19px 0}}
.header-actions{display:flex;gap:5px}header{flex-wrap:wrap}.header-actions .quiet{font-size:11px;padding:7px}.slot{font-size:26px}.card{font-size:25px}.keys button{min-width:0}.prompt{font-variant-numeric:tabular-nums}main{position:relative;padding:10px 12px}h1{font-size:18px}.prompt{margin:9px 0 7px;font-size:14px;line-height:1.5}.conditions{padding:10px 0 12px;gap:24px}.card{height:52px;min-width:58px}.condition{font-size:22px}.equation{padding:12px 8px;margin:3px 0 8px}.slot{height:56px}.note{display:none}.answer{margin:8px 0;gap:9px}.answer output{height:48px;min-width:80px}.answer .action{width:auto;min-width:76px;min-height:48px;padding:0 12px;font:700 14px sans-serif}.keys button{height:44px}#message{min-height:0;margin:7px 0;font-size:13px;line-height:1.5}#message:empty{display:none}.foot{margin-top:9px}#hintBox{position:absolute;z-index:5;top:6px;left:8px;right:8px;background:#fffef4;border:1px solid #d4b875;border-radius:12px;padding:10px;box-shadow:0 5px 18px #22335530}.hint-head{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:9px}.hint-head strong{margin-right:auto}#hintContent{font-size:16px;line-height:1.6}.hint-equation{display:flex;align-items:center;justify-content:center;gap:12px;font-family:Georgia,serif;font-size:24px;padding:4px 0}.fraction{display:inline-flex;flex-direction:column;text-align:center;line-height:1.2}.fraction>span{padding:3px 6px}.fraction>span:first-child{border-bottom:2px solid currentColor}
</style></head><body><main><header><h1>代入して a を求めよう</h1><div class="header-actions"><button class="quiet" id="sound" aria-pressed="true">音 ON</button><button class="quiet" id="new">問題を更新</button></div></header><p class="prompt" id="prompt"></p><div class="step" id="step">① 数字を運んで代入</div><div class="conditions"><div class="condition"><i>x</i>＝<button class="card" id="cardX" aria-label="x の値をドラッグ"></button></div><div class="condition"><i>y</i>＝<button class="card" id="cardY" aria-label="y の値をドラッグ"></button></div></div><section class="equation" aria-label="代入する式"><span class="slot" id="slotY" aria-label="y の置き場所">y</span><span>＝</span><i>a</i><span>×</span><span class="slot" id="slotX" aria-label="x の置き場所">x</span></section><p class="note" id="note">青い数字を押したまま、式の同じ文字まで運ぼう。</p><section id="answerPanel" hidden aria-label="比例定数を答える"><div class="answer"><i>a</i>＝<output id="answer" aria-live="polite">?</output><button class="action" id="check" disabled>確認</button></div><div id="keys" class="keys"></div></section><p id="message" role="status" aria-live="polite"></p><div class="foot"><button class="quiet" id="hint">？ ヒント</button><button class="quiet" id="reset">この問題をやり直す</button></div><aside id="hintBox" hidden aria-label="段階ヒント"><div class="hint-head"><strong id="hintTitle"></strong><button class="quiet" id="hintNext">次へ</button><button class="quiet" id="hintClose" aria-label="ヒントを閉じる">×</button></div><div id="hintContent"></div></aside></main><script>
const $=id=>document.getElementById(id);let q,placed={X:false,Y:false},answer='',solved=false,drag=null,lastKey='',hintStage=0;
let soundOn=true,audio=null,voices=[];
function play(kind){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio??=new AC();audio.resume().catch(()=>{});const start=audio.currentTime,notes=kind==='correct'?[660,880,1100]:kind==='place'?[740,980]:[330,260];notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=start+i*.08;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(audio.destination);voices.push(o);o.onended=()=>{voices=voices.filter(v=>v!==o);o.disconnect();g.disconnect()};o.start(t);o.stop(t+.18)})}catch(e){}}
$('sound').onclick=()=>{soundOn=!soundOn;if(!soundOn){voices.forEach(o=>{try{o.stop()}catch(e){}});voices=[]}$('sound').textContent=soundOn?'音 ON':'音 OFF';$('sound').setAttribute('aria-pressed',String(soundOn))};
function stopDrag(){if(!drag)return;drag.ghost.remove();drag=null;for(const k of ['X','Y'])$('slot'+k).classList.remove('over')}
function reset(){stopDrag();hintStage=0;$('hintBox').hidden=true;placed={X:false,Y:false};answer='';solved=false;for(const k of ['X','Y']){$('slot'+k).textContent=k.toLowerCase();$('slot'+k).className='slot';$('card'+k).className='card';$('card'+k).disabled=false;$('card'+k).textContent=q[k.toLowerCase()];$('card'+k).setAttribute('aria-label',`${k.toLowerCase()} の値 ${q[k.toLowerCase()]} をドラッグ`)}$('answer').textContent='?';$('answerPanel').hidden=true;$('step').textContent='① 数字を下の文字へドラッグ';$('note').textContent='青い数字を押したまま、式の同じ文字まで運ぼう。';$('message').textContent='';$('message').className='';$('check').disabled=true;$('check').textContent='確認';for(const b of $('keys').children)b.disabled=false}
function newQuestion(){let x,a,key;do{x=(2+Math.floor(Math.random()*7))*(Math.random()<.5?-1:1);a=(1+Math.floor(Math.random()*9))*(Math.random()<.5?-1:1);key=x+':'+a}while(key===lastKey);lastKey=key;q={x,y:x*a,a};$('prompt').textContent='条件を代入して、比例定数 a を求めよう。';reset()}
function place(k){$('hintBox').hidden=true;play('place');placed[k]=true;$('slot'+k).textContent=k==='X'&&q.x<0?'('+q.x+')':q[k.toLowerCase()];$('slot'+k).className='slot filled pop';$('card'+k).classList.add('used');$('card'+k).disabled=true;if(placed.X&&placed.Y){$('answerPanel').hidden=false;$('step').textContent='② a の値を計算しよう';$('note').textContent=`${q.y}＝a × ${q.x<0?'('+q.x+')':q.x} になったね。`;$('message').textContent='';$('check').textContent='確認'}else{$('message').textContent=''}}
function destination(x,y){for(const k of ['X','Y']){const r=$('slot'+k).getBoundingClientRect();if(x>=r.left-12&&x<=r.right+12&&y>=r.top-16&&y<=r.bottom+16)return k}return null}
for(const k of ['X','Y']){const c=$('card'+k);c.onpointerdown=e=>{if(placed[k]||drag||e.isPrimary===false)return;e.preventDefault();const ghost=c.cloneNode(true);ghost.removeAttribute('id');ghost.setAttribute('aria-hidden','true');ghost.className='card ghost';document.body.append(ghost);drag={k,ghost,id:e.pointerId,startX:e.clientX,startY:e.clientY,moved:false};c.setPointerCapture(e.pointerId);move(e)};c.onpointermove=move;c.onpointerup=e=>{if(!drag||drag.id!==e.pointerId)return;const from=drag.k,to=destination(e.clientX,e.clientY),moved=drag.moved;stopDrag();if(moved&&to===from&&!placed[from])place(from);else $('message').textContent=!moved?'数字を押したまま、下の文字まで運ぼう。':to?`これは ${from.toLowerCase()} の値だね。式の ${from.toLowerCase()} に運ぼう。`:'下の式の文字に重ねて、指を離してみよう。'};c.onpointercancel=()=>stopDrag();c.onlostpointercapture=()=>stopDrag()}
function move(e){if(!drag||drag.id!==e.pointerId)return;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>8)drag.moved=true;drag.ghost.style.left=e.clientX-31+'px';drag.ghost.style.top=e.clientY-31+'px';const to=destination(e.clientX,e.clientY);for(const k of ['X','Y'])$('slot'+k).classList.toggle('over',to===k&&!placed[k])}
function key(k){if(solved||!placed.X||!placed.Y)return;if(k==='⌫')answer=answer.slice(0,-1);else if(k==='−')answer=answer.startsWith('-')?answer.slice(1):'-'+answer;else if(answer.replace('-','').length<3)answer+=k;$('answer').textContent=answer||'?';$('check').disabled=!/^-?\d+$/.test(answer)}
for(const k of ['1','2','3','4','5','⌫','6','7','8','9','0','−']){const b=document.createElement('button');b.textContent=k;b.setAttribute('aria-label',k==='−'?'符号を変える':k==='⌫'?'１文字消す':k);b.onclick=()=>key(k);$('keys').append(b)}
$('check').onclick=()=>{if(solved){newQuestion();return}if(!/^-?\d+$/.test(answer)||!placed.X||!placed.Y)return;if(Number(answer)===q.a){solved=true;play('correct');$('message').className='success';$('message').textContent=`正解！ a＝${q.a}。${q.a} × ${q.x}＝${q.y} だね。`;$('check').textContent='次へ';for(const b of $('keys').children)b.disabled=true}else{play('retry');$('message').textContent=`${answer} × ${q.x} は ${Number(answer)*q.x}。${q.y} になる数を考えよう。`}};
function showHint(){const x=q.x<0?'('+q.x+')':String(q.x);$('hintBox').hidden=false;if(!placed.X||!placed.Y){$('hintTitle').textContent='代入のヒント';$('hintContent').textContent='x の数字は x へ、y の数字は y へ。押したまま下の式に運ぼう。';$('hintNext').hidden=true;return}
 hintStage=Math.max(1,Math.min(3,hintStage));$('hintTitle').textContent=`計算のヒント ${hintStage}/3`;$('hintNext').hidden=hintStage===3;
 if(hintStage===1)$('hintContent').textContent=`a × ${x} を a にするには？`;
 if(hintStage===2)$('hintContent').textContent=`両辺を ${x} で割ろう。`;
 if(hintStage===3)$('hintContent').innerHTML=`<div class="hint-equation" aria-label="${q.y} 割る ${q.x} イコール a かける ${q.x} 割る ${q.x}"><span class="fraction"><span>${q.y}</span><span>${x}</span></span><span>＝</span><span class="fraction"><span><i>a</i> × ${x}</span><span>${x}</span></span></div>`;
}
$('hint').onclick=()=>{if(!$('hintBox').hidden&&placed.X&&placed.Y)hintStage=Math.min(3,hintStage+1);showHint()};$('hintNext').onclick=()=>{hintStage++;showHint()};$('hintClose').onclick=()=>{$('hintBox').hidden=true};
$('new').onclick=newQuestion;$('reset').onclick=reset;newQuestion();
</script></body></html>
