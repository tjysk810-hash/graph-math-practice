function rat(n,d=1){if(!d)throw Error('分母は０にできません。');if(d<0){n=-n;d=-d}const g=gcd(n,d);return {n:n/g,d:d/g}}
const add=(a,b)=>rat(a.n*b.d+b.n*a.d,a.d*b.d);
const sub=(a,b)=>rat(a.n*b.d-b.n*a.d,a.d*b.d);
const mul=(a,b)=>rat(a.n*b.n,a.d*b.d);
const div=(a,b)=>rat(a.n*b.d,a.d*b.n);
const eq=(a,b)=>a.n===b.n&&a.d===b.d;
const num=a=>a.n/a.d;
const str=a=>a.d===1?String(a.n):`${a.n}/${a.d}`;
function parse(s){s=String(s).trim().replace(/−/g,'-');if(!/^-?\d{1,4}(\/\d{1,4})?$/.test(s))throw Error('整数、または「1/2」の形で入力しよう。');const[n,d=1]=s.split('/').map(Number);return rat(n,d)}
function frac(a){const sign=a.n<0?'−':'';return sign+(a.d===1?Math.abs(a.n):`<span class="frac"><span>${Math.abs(a.n)}</span><span>${a.d}</span></span>`)}
function formula(a,b){return `<i>y</i> = ${Math.abs(a.n)===a.d?(a.n<0?'−':''):frac(a)}<i>x</i>${b.n?` ${b.n<0?'−':'+'} ${frac(rat(Math.abs(b.n),b.d))}`:''}`}
function makePool(level){const map=new Map();for(let d=1;d<=4;d++)for(let n=-5;n<=5;n++){if(!n||gcd(n,d)!==1)continue;const a=rat(n,d);for(let x0=-3;x0<=3;x0++)for(let y0=-4;y0<=4;y0++){const b=sub(rat(y0),mul(a,rat(x0)));if(Math.abs(num(b))>5)continue;if(level==='integer'&&(a.d!==1||b.d!==1))continue;if(level==='fraction'&&a.d===1&&b.d===1)continue;const pts=[];for(let x=-5;x<=5;x++){const y=add(mul(a,rat(x)),b);if(y.d===1&&Math.abs(y.n)<=5)pts.push([rat(x),y])}if(pts.length<2)continue;map.set(str(a)+','+str(b),{a,b,pts})}}return [...map.values()]}
const pools={integer:makePool('integer'),fraction:makePool('fraction')};
const colors=['#2c52cc','#aa520c'];
const state={mode:'draw',level:'integer',form:'slope',stage:0,q:null,count:0,points:[[null,null],[null,null]],values:{},active:null,targetPoint:0,solved:false,hintStage:0};
function samePoint(p,q){return eq(p[0],q[0])&&eq(p[1],q[1])}
function onLine(p,q){return eq(p[1],add(mul(q.a,p[0]),q.b))}
function standard(q){const scale=q.a.d*q.b.d/gcd(q.a.d,q.b.d);let A=-q.a.n*scale/q.a.d,B=scale,C=q.b.n*scale/q.b.d;const g=gcd(gcd(A,B),C);A/=g;B/=g;C/=g;if(A<0){A=-A;B=-B;C=-C}return{A,B,C}}
function term(n,v,first=false){return(n<0?'−':first?'':'+')+(Math.abs(n)===1?'':Math.abs(n))+`<i>${v}</i>`}
function standardFormula(q){const{A,B,C}=standard(q);return `${term(A,'x',true)} ${term(B,'y')} = ${C<0?'−'+Math.abs(C):C}`}
function makeSystems(){
 const all=[...pools.integer,...pools.fraction].filter(q=>Math.abs(num(q.a))<=3);
 const groups={integer:[],fraction:[]};
 for(let x=-3;x<=3;x++)for(let y=-3;y<=3;y++){
  const answer=[rat(x),rat(y)],through=all.filter(q=>onLine(answer,q));
  for(let i=0;i<through.length;i++)for(let j=i+1;j<through.length;j++){
   const a=through[i],b=through[j];if(eq(a.a,b.a))continue;
   const type=a.a.d===1&&a.b.d===1&&b.a.d===1&&b.b.d===1?'integer':'fraction';
   groups[type].push({lines:[a,b],answer});
  }
 }
 return groups;
}
const systemPools=makeSystems();
function makeReadSystems(){
 const lines=pools.integer.filter(q=>Math.abs(num(q.a))<=3),out=[];
 for(let i=0;i<lines.length;i++)for(let j=i+1;j<lines.length;j++){
  const p=lines[i],r=lines[j];if(eq(p.a,r.a))continue;
  const x=div(sub(r.b,p.b),sub(p.a,r.a)),y=add(mul(p.a,x),p.b);
  if((x.d===1&&y.d===1)||Math.abs(num(x))>4||Math.abs(num(y))>4||x.d>5||y.d>5)continue;
  out.push({lines:[p,r],answer:[x,y]});
 }
 return out;
}
const readSystems=makeReadSystems();
function questionKey(q){return q?q.lines.map(l=>str(l.a)+','+str(l.b)).sort().join('|'):''}
function chooseQuestion(){const pool=state.mode==='read'?readSystems:systemPools[state.level];let q;do{q=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&questionKey(q)===questionKey(state.q));return {...q,lines:Math.random()<.5?[...q.lines]:[...q.lines].reverse()}}
function newQuestion(){state.q=chooseQuestion();state.count++;$('#questionNo').textContent=String(state.count).padStart(2,'0');restart()}
function message(text,type=''){$('#feedback').textContent=text;$('#feedback').className=type}
function hideHint(){state.hintStage=0;$('#hint').hidden=true;$('#hintButton').setAttribute('aria-expanded','false')}
function restart(){state.stage=0;state.solved=false;state.points=[[null,null],[null,null]];state.values={};state.targetPoint=0;hideHint();closeKeyboard();render();message(state.mode==='read'?'青の２点から、傾き a と切片 b を求めよう。':'青の式に合う２点を置こう。座標入力も使えます。')}

 if(state.solved){restart();return}
 state.values={};state.targetPoint=0;if(state.stage<2)state.points[state.stage]=[null,null];hideHint();closeKeyboard();render();message(state.mode==='read'&&state.stage<2?'傾き a と切片 b を入力し直そう。':state.stage<2?'２点を置き直そう。':'交点の x と y を入力しよう。');
}
function render(){
 if(state.mode==='read'){renderRead();return}
 $('#levelBadge').textContent=state.level==='integer'?'整数':'分数';
 $('#step0').textContent='① 青の直線';$('#step1').textContent='② 橙の直線';
 $('#equationCaption').textContent='問題';$('#graph').setAttribute('aria-label','２本の直線を描く座標平面');
 $('#app').dataset.stage=String(state.stage);
 for(let i=0;i<3;i++){$('#step'+i).setAttribute('aria-current',state.stage===i?'step':'false');$('#step'+i).classList.toggle('complete',state.stage>i||state.solved)}
 for(let i=0;i<2;i++){$('#equation'+i).innerHTML=`<span class="eq-number">${i+1}</span>`+(state.form==='standard'?standardFormula(state.q.lines[i]):formula(state.q.lines[i].a,state.q.lines[i].b));$('#equation'+i).classList.toggle('active',state.stage===i)}

 $('#check').textContent=state.stage===0?'青のグラフを確かめる':state.stage===1?'橙のグラフを確かめる':'解を確かめる';$('#check').hidden=state.solved;$('#next').hidden=!state.solved;$('#verification').hidden=!state.solved;
 renderPanel();drawGraph();
}
function renderPanel(){
 if(state.mode==='read'&&state.stage===2){renderFractionAnswer();return}
 if(state.mode==='read'&&state.stage<2){renderReadPanel();return}
 const field=(id,label,placeholder)=>`<input id="${id}" class="number-field" readonly inputmode="none" aria-label="${label}" placeholder="${placeholder}" value="${state.values[id]||''}">`;
 const tools=row=>`<button class="edit-btn" data-edit="minus" data-row="${row}" aria-label="${row==='xy'?'解':'点'+(row==='0'?'A':'B')}の符号を変える">−</button><button class="edit-btn fraction" data-edit="fraction" data-row="${row}" aria-label="${row==='xy'?'解':'点'+(row==='0'?'A':'B')}を分数で入力">分数</button>`;

 $('#answerPanel').innerHTML=state.stage<2?point(0)+point(1):`<div class="input-row answer-xy">${tools('xy')}<div class="coord-fields"><label class="coefficient-label" for="x"><i>x</i><span>＝</span></label>${field('x','解の x','x')}<label class="coefficient-label" for="y"><i>y</i><span>＝</span></label>${field('y','解の y','y')}</div></div>`;
 document.querySelectorAll('.number-field').forEach(e=>{e.onclick=()=>activate(e.id);e.onfocus=()=>activate(e.id)});
 document.querySelectorAll('[data-select-point]').forEach(e=>e.onclick=()=>{selectPoint(Number(e.dataset.selectPoint));closeKeyboard();message(`次のタップで点${state.targetPoint?'B':'A'}を配置。`)});

function renderFractionAnswer(){
 const ids=[];
 const field=(id,label,placeholder)=>{ids.push(id);return `<input id="${id}" class="number-field" readonly inputmode="none" aria-label="${label}" placeholder="${placeholder}" value="${state.values[id]||''}" ${state.solved?'disabled':''}>`};
 const coordinate=(axis,index)=>{
  if(state.q.answer[index].d===1)return `<label class="coefficient-label" for="${axis}"><i>${axis}</i><span>＝</span></label>${field(axis,'解の '+axis,axis)}`;
  // Preserve the submitted form (including unreduced fractions) after checking.
  if(state.values[axis]&&!Object.hasOwn(state.values,axis+'N')){const [n,d='']=state.values[axis].split('/');state.values[axis+'N']=n;state.values[axis+'D']=d}
  return `<label class="coefficient-label" for="${axis}N"><i>${axis}</i><span>＝</span></label><div class="fraction-entry" role="group" aria-label="${axis} の分数">${field(axis+'N',axis+' の分子','分子')}<span class="fraction-rule" aria-hidden="true"></span>${field(axis+'D',axis+' の分母','分母')}</div>`;
 };
 $('#answerPanel').innerHTML=`<div class="input-row answer-xy fraction-answer"><button id="answerMinus" class="edit-btn" aria-label="選択中の座標の符号を変える" ${state.solved?'disabled':''}>−</button><div class="coord-fields">${coordinate('x',0)}${coordinate('y',1)}</div></div>`;
 for(const id of ids){$('#'+id).onclick=()=>activate(id);$('#'+id).onfocus=()=>activate(id)}
 $('#answerMinus').onclick=()=>{if(!ids.includes(state.active))activate(ids[0]);edit('minus')};
}
function selectPoint(i){state.targetPoint=i;document.querySelectorAll('[data-select-point]').forEach(e=>e.setAttribute('aria-pressed',String(Number(e.dataset.selectPoint)===i)))}
function activate(id){if(state.solved)return;state.active=id;if(id.startsWith('p'))selectPoint(Number(id[1]));$('#keypad').hidden=false;$('#app').classList.add('editing');document.querySelectorAll('.number-field').forEach(e=>e.classList.toggle('active',e.id===id))}
function closeKeyboard(){state.active=null;$('#keypad').hidden=true;$('#app').classList.remove('editing');document.querySelectorAll('.number-field').forEach(e=>e.classList.remove('active'))}
function edit(key){
 if(!state.active||state.solved)return;
 if(state.mode==='read'&&state.stage===2&&/^[xy][ND]$/.test(state.active)){
  const axis=state.active[0];
  if(key==='fraction'){activate(axis+'D');return}
  if(key==='minus'&&state.active.endsWith('D'))activate(axis+'N');
 }
 const id=state.active;let v=state.values[id]||'';
 if(key==='minus')v=v.startsWith('-')?v.slice(1):'-'+v;else if(key==='fraction'){if(v&&v!=='-'&&!v.includes('/'))v+='/'}else if(key==='back')v=v.slice(0,-1);else if(key==='clear')v='';else if(/^\d$/.test(key)&&v.length<10)v+=key;else return;
 state.values[id]=v;if(/^[xy][ND]$/.test(id)){const axis=id[0];state.values[axis]=(state.values[axis+'N']||'')+'/'+(state.values[axis+'D']||'')}$('#'+id).value=v;$('#'+id).classList.remove('saved');
 if(id.startsWith('p')){state.points[state.stage][Number(id[1])]=null;$(`[data-commit="${id[1]}"]`).textContent='確定';drawGraph()}else drawGraph();
 message(state.mode==='read'&&state.stage<2?'a と b を入力し、式を確かめよう。':state.stage===2?'入力できたら「解を確かめる」を押そう。':'座標は横の「確定」でグラフに反映。');
}
function readPoint(i){const p=[parse(state.values[`p${i}x`]||''),parse(state.values[`p${i}y`]||'')];if(p.some(v=>Math.abs(num(v))>6))throw Error('座標は −6〜6 の範囲で入力しよう。');return p}
function commit(i){if(state.solved||state.stage===2)return;try{state.points[state.stage][i]=readPoint(i);[`p${i}x`,`p${i}y`].forEach(id=>$('#'+id).classList.add('saved'));$(`[data-commit="${i}"]`).textContent='確定済';closeKeyboard();drawGraph();message(state.points[state.stage].every(Boolean)?'２点を結びました。グラフを確かめよう。':'もう１点を置こう。')}catch(e){message(e.message,'error')}}
function check(){
 if(state.solved)return;closeKeyboard();
 if(state.mode==='read'&&state.stage<2){checkReadEquation();return}
 if(state.stage<2){
  // A check also accepts coordinates that were typed without pressing the row button.
  try{const fresh=[readPoint(0),readPoint(1)];state.points[state.stage]=fresh}catch(e){message(e.message,'error');return}
  const pts=state.points[state.stage];drawGraph();
  if(samePoint(...pts)){message('異なる２点を選ぼう。','error');return}
  const valid=pts.map(p=>onLine(p,state.q.lines[state.stage]));if(!valid.every(Boolean)){message((valid[0]?'点Aは合っています。':valid[1]?'点Bは合っています。':'')+'点の座標を、いまの色の式に代入して確認しよう。','error');return}
  state.stage++;state.values={};state.targetPoint=0;hideHint();render();message(state.stage===1?'青のグラフは正解！ 次は橙のグラフ。':'２本とも正解！ 交点の x と y を入力しよう。','success');return;
 }
 try{if(!state.values.x||!state.values.y)throw Error('x と y の両方を入力しよう。');const answer=[parse(state.values.x),parse(state.values.y)];if(!samePoint(answer,state.q.answer)){const on=state.q.lines.map(q=>onLine(answer,q));if(state.mode==='read'){message(on[0]?'青の式は満たしています。橙の式にも代入して確かめよう。':on[1]?'橙の式は満たしています。青の式にも代入して確かめよう。':'計算した x、y を両方の式に代入して確かめよう。','error');return}message(on[0]?'青の式は満たしています。橙の直線にも乗る点を探そう。':on[1]?'橙の式は満たしています。青の直線にも乗る点を探そう。':'２本の直線が交わる点を確認しよう。','error');return}
 state.solved=true;hideHint();render();renderVerification();message('正解！ 交点は、２つの式を同時に満たす解です。','success');

function renderVerification(){
 const[x,y]=state.q.answer;const val=v=>v.n<0?'('+frac(v)+')':frac(v);
 const rows=state.q.lines.map((q,i)=>{let calc;if(state.mode==='draw'&&state.form==='standard'){const{A,B,C}=standard(q);const left=add(mul(rat(A),x),mul(rat(B),y));calc=`${A} × ${val(x)} ${B<0?'−':'+'} ${Math.abs(B)} × ${val(y)} = ${frac(left)} = ${C}`}else{const right=add(mul(q.a,x),q.b);calc=`${val(q.a)} × ${val(x)} ${q.b.n<0?'−':'+'} ${frac(rat(Math.abs(q.b.n),q.b.d))} = ${frac(right)} = <i>y</i>`}return `<div class="verification-row" style="color:${colors[i]}">${i+1}式： ${calc} ✓</div>`}).join('');

}
function lineFromPoints(pts){if(!pts.every(Boolean)||samePoint(...pts))return null;const[p,r]=pts;if(eq(p[0],r[0]))return{vertical:p[0]};const a=div(sub(r[1],p[1]),sub(r[0],p[0]));return{a,b:sub(p[1],mul(a,p[0]))}}
function guidePair(q){const pts=q.pts.slice().sort((p,r)=>Math.abs(num(p[0]))-Math.abs(num(r[0])));const p=pts[0],r=pts.slice(1).sort((v,w)=>Math.abs(num(sub(v[0],p[0])))-Math.abs(num(sub(w[0],p[0]))))[0];return[p,r].sort((v,w)=>num(v[0])-num(w[0]))}
function hintStages(){if(state.mode==='read')return 3;return state.stage===2?2:state.form==='standard'?4:3}
function hintPicture(px,py){

 const q=state.q.lines[state.stage],[p,r]=guidePair(q),x1=px(num(p[0])),x2=px(num(r[0])),y1=py(num(p[1])),y2=py(num(r[1])),dx=sub(r[0],p[0]),dy=sub(r[1],p[1]);
 const label=(x,y,t,anchor='middle')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" fill="#08767c" font-size="12" font-weight="600" stroke="white" stroke-width="4" paint-order="stroke">${t}</text>`;

function readAnswer(){try{return [parse(state.values.x||''),parse(state.values.y||'')]}catch{return null}}
function drawGraph(){
 $('#pointTip').hidden=true;const px=x=>180+22*x,py=y=>160-22*y;

 for(let line=0;line<2;line++){

 pts.forEach((p,i)=>{if(!p)return;const x=px(num(p[0])),y=py(num(p[1])),active=line===state.stage;svg+=`<g class="plot-point" data-line="${line}" data-point="${i}" role="button" tabindex="0" aria-label="${line?'橙':'青'}の点${i?'B':'A'} (${str(p[0])}, ${str(p[1])})"><circle cx="${x}" cy="${y}" r="11" fill="transparent"/><circle cx="${x}" cy="${y}" r="${active?4.5:3.3}" fill="${colors[line]}" stroke="white" stroke-width="1.5"/>${active?`<text x="${x>(state.mode==='read'?220:265)?x-10:x+10}" y="${y<48?y+19:y-11}" text-anchor="${x>(state.mode==='read'?220:265)?'end':'start'}" font-size="13" fill="${colors[line]}" font-weight="600" stroke="white" stroke-width="4" paint-order="stroke">${state.mode==='read'?`(${str(p[0])}, ${str(p[1])})`:i?'B':'A'}</text>`:state.mode==='read'?`<text x="${x>220?x-8:x+8}" y="${y<48?y+18:y-10}" text-anchor="${x>220?'end':'start'}" font-size="10" fill="${colors[line]}" stroke="white" stroke-width="3" paint-order="stroke">(${str(p[0])}, ${str(p[1])})</text>`:''}</g>`});
 }

 document.querySelectorAll('[data-point]').forEach(e=>{const show=()=>{const line=Number(e.dataset.line),i=Number(e.dataset.point),p=state.mode==='read'?guidePair(state.q.lines[line])[i]:state.points[line][i];if(state.mode==='draw'&&state.stage<2&&line===state.stage){selectPoint(i);closeKeyboard();message(`次のタップで点${i?'B':'A'}を移動。`)}$('#pointTip').textContent=`${line?'橙':'青'} (${str(p[0])}, ${str(p[1])})`;$('#pointTip').hidden=false};e.onclick=event=>{event.stopPropagation();show()};e.onkeydown=event=>{if(['Enter',' '].includes(event.key)){event.preventDefault();show()}}});
}
function snapGraphPoint(x,y){return x<48||x>312||y<28||y>292?null:[Math.round((x-180)/22)||0,Math.round((160-y)/22)||0]}
function placePoint(event){
 if(state.mode==='read'||state.solved||event.target.closest('.plot-point'))return;const svg=$('#graph'),m=svg.getScreenCTM();if(!m)return;const p=svg.createSVGPoint();p.x=event.clientX;p.y=event.clientY;const local=p.matrixTransform(m.inverse()),point=snapGraphPoint(local.x,local.y);if(!point)return;
 if(state.stage===2){for(const[id,value]of[['x',point[0]],['y',point[1]]]){state.values[id]=String(value);$('#'+id).value=String(value)}closeKeyboard();drawGraph();message('選んだ座標で「解を確かめる」を押そう。');return}
 const i=state.targetPoint;for(const[axis,value]of[['x',point[0]],['y',point[1]]]){const id=`p${i}${axis}`;state.values[id]=String(value);$('#'+id).value=String(value)}commit(i);if(!state.points[state.stage][1-i])selectPoint(1-i);
}
function showHint(){state.hintStage=$('#hint').hidden?1:Math.min(hintStages(),state.hintStage+1);$('#hint').hidden=false;$('#hintButton').setAttribute('aria-expanded','true');paintHint();drawGraph()}
function paintHint(){
 if(state.mode==='read'){paintReadHint();return}
 const n=state.hintStage;$('#hintTitle').textContent=(state.stage===2?'交点':state.stage===0?'青のグラフ':'橙のグラフ')+'のヒント '+n+'/'+hintStages();$('#hintNext').hidden=n===hintStages();$('#hintNext').textContent=n===hintStages()-1?'図で見る':'次のヒント';
 if(state.stage===2){$('#hintText').textContent=n===1?'２本の直線が交わる点はどこ？ その点なら、両方の式を満たします。':'緑の丸が交点。横の x と縦の y を読み取ろう。';return}
 const q=state.q.lines[state.stage],calc=html=>`<span class="hint-calculation">${html}</span>`;
 if(state.form==='standard'&&n===1){$('#hintText').innerHTML='まず <i>y</i> = … の形に直してみよう。';return}
 if(state.form==='standard'&&n===2){const{A,B,C}=standard(q);$('#hintText').innerHTML='x の項を右辺へ移項。'+calc(`${term(B,'y',true)} = ${C} ${term(-A,'x')}`)+`両辺を ${B} で割ると？`;return}
 const step=state.form==='standard'?n-2:n;
 if(step===1)$('#hintText').innerHTML=(state.form==='standard'?calc(formula(q.a,q.b)):'')+(q.b.d===1?'まず切片の点 (0, b) を探そう。':'切片が分数。x、y が整数になる点を探そう。');
 else if(step===2&&state.form==='slope')$('#hintText').innerHTML=q.b.d===1?'切片から、右へ傾きの分母の数、上下へ分子の数。負の傾きなら下へ。':'x に 1、2、…を代入し、y も整数になる点を探そう。';
 if(n===hintStages()){const[p,r]=guidePair(q);$('#hintText').innerHTML=`例：(${str(p[0])}, ${str(p[1])}) と (${str(r[0])}, ${str(r[1])})。`+'<span class="hint-caption">横・縦の変化の比が傾きになります。この２点以外でも、同じ直線なら正解です。</span>'}
}
function settings(open){$('#settings').hidden=!open;$('#settingsToggle').setAttribute('aria-expanded',String(open))}
function setLevel(level){if(!systemPools[level])throw Error('難易度が無効です。');if(state.level!==level){state.level=level;document.querySelectorAll('[data-level]').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.level===level)));$('#levelBadge').textContent=level==='integer'?'整数':'分数';newQuestion()}settings(false)}
function setForm(form){if(!['standard','slope'].includes(form))throw Error('式の形が無効です。');if(state.form!==form){state.form=form;document.querySelectorAll('[data-form]').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.form===form)));newQuestion()}settings(false)}

function setMode(mode){
 if(!['draw','read'].includes(mode)||state.mode===mode)return;
 state.mode=mode;document.querySelectorAll('[data-mode]').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.mode===mode)));
 $('#drawSettings').hidden=mode==='read';$('#readSettings').hidden=mode!=='read';settings(false);newQuestion();
}
function renderRead(){
 $('#equationCaption').textContent='式';$('#graph').setAttribute('aria-label','青と橙の直線。各直線上の２点の座標から式を求める座標平面');
 $('#app').dataset.stage=String(state.stage);$('#levelBadge').textContent='交点は分数';
 ['① 青の式','② 橙の式','③ 交点'].forEach((label,i)=>{const el=$('#step'+i);el.textContent=label;el.setAttribute('aria-current',state.stage===i?'step':'false');el.classList.toggle('complete',state.stage>i||state.solved)});
 for(let i=0;i<2;i++){$('#equation'+i).innerHTML=`<span class="eq-number">${i+1}</span>`+(state.stage>i?formula(state.q.lines[i].a,state.q.lines[i].b):'<i>y</i> = <i>a</i><i>x</i> + <i>b</i>');$('#equation'+i).classList.toggle('active',state.stage===i)}
 $('#instruction').textContent=state.stage<2?(state.stage===0?'青':'橙')+'の２点から、式を求めよう。':'紙で連立を解き、交点を求めよう。';
 $('#check').textContent=state.stage<2?(state.stage===0?'青':'橙')+'の式を確かめる':'解を確かめる';$('#check').hidden=state.solved;$('#next').hidden=!state.solved;$('#verification').hidden=!state.solved;
 renderPanel();drawGraph();
}
function renderReadPanel(){
 const field=id=>`<label class="coefficient-label" for="${id}"><i>${id}</i><span>＝</span></label><input id="${id}" class="number-field" readonly inputmode="none" aria-label="${id==='a'?'傾き a':'切片 b'}" placeholder="${id}" value="${state.values[id]||''}">`;
 $('#answerPanel').innerHTML=`<div class="input-row"><button class="edit-btn" id="readMinus" aria-label="選択中の数の符号を変える">−</button><button class="edit-btn fraction" id="readFraction" aria-label="選択中の数を分数で入力">分数</button><div class="coord-fields">${field('a')}${field('b')}</div></div>`;
 for(const id of ['a','b']){$('#'+id).onclick=()=>activate(id);$('#'+id).onfocus=()=>activate(id)}
 $('#readMinus').onclick=()=>{if(!['a','b'].includes(state.active))activate('a');edit('minus')};$('#readFraction').onclick=()=>{if(!['a','b'].includes(state.active))activate('a');edit('fraction')};
}
function checkReadEquation(){
 try{
  const a=parse(state.values.a||''),b=parse(state.values.b||''),q=state.q.lines[state.stage];
  if(!eq(a,q.a)||!eq(b,q.b)){message(eq(a,q.a)?'傾きは合っています。点の座標を代入して、切片を確認しよう。':'２点の横の変化と縦の変化から、傾きを確認しよう。','error');return}
  state.stage++;state.values={};hideHint();render();message(state.stage===1?'青の式は正解！ 次は橙の式。':'２式とも正解！ 紙で連立を解き、交点を分数で入力しよう。','success');
 }catch(e){message(e.message,'error')}
}
function paintReadHint(){
 const n=state.hintStage;$('#hintTitle').textContent=(state.stage===2?'連立の計算':state.stage===0?'青の式':'橙の式')+'のヒント '+n+'/3';$('#hintNext').hidden=n===3;$('#hintNext').textContent='次のヒント';
 if(state.stage<2){const q=state.q.lines[state.stage],[p,r]=guidePair(q);$('#hintText').innerHTML=n===1?'まず傾き。<span class="hint-formula"><i>a</i>＝<span class="hint-fraction"><span>縦の変化</span><span>横の変化</span></span></span>':n===2?`<span class="hint-formula"><i>a</i>＝<span class="hint-fraction"><span>${str(r[1])} − (${str(p[1])})</span><span>${str(r[0])} − (${str(p[0])})</span></span></span><span class="hint-caption">求めた傾きと１点を y＝ax＋b に代入すると、b は？</span>`:`図の横・縦の変化を確かめよう。<span class="hint-calculation">${frac(p[1])} = <i>a</i> × (${frac(p[0])}) + <i>b</i></span>自分で求めた a を入れて、b を求めよう。`;return}
 const [p,r]=state.q.lines,da=sub(p.a,r.a),db=sub(r.b,p.b);
 $('#hintText').innerHTML=n===1?'交点では、２つの式の x と y が同じ値。両方の右辺を等しいとして、x の式を作ろう。':n===2?`２式を引くと y が消えます。<span class="hint-calculation">(${frac(p.a)} − (${frac(r.a)}))<i>x</i> = ${frac(r.b)} − (${frac(p.b)})</span>`:`<span class="hint-calculation">${frac(da)}<i>x</i> = ${frac(db)}</span>x を求め、どちらかの式に代入して y を求めよう。分数のまま入力できます。`;
}
document.querySelectorAll('[data-mode]').forEach(e=>e.onclick=()=>setMode(e.dataset.mode));

document.querySelectorAll('[data-level]').forEach(e=>e.onclick=()=>setLevel(e.dataset.level));document.querySelectorAll('[data-form]').forEach(e=>e.onclick=()=>setForm(e.dataset.form));
$('#settingsToggle').onclick=()=>settings($('#settings').hidden);$('#closeSettings').onclick=()=>settings(false);$('#refreshQuestion').onclick=newQuestion;$('#reset').onclick=resetStage;$('#restart').onclick=restart;$('#check').onclick=check;$('#next').onclick=newQuestion;$('#graph').addEventListener('click',placePoint);$('#hintButton').onclick=showHint;$('#hintNext').onclick=showHint;$('#closeHint').onclick=()=>{hideHint();drawGraph()};
const keys=['1','2','3','4','5','back','6','7','8','9','0','clear'];$('.keypad-grid').innerHTML=keys.map(k=>`<button data-key="${k}" aria-label="${k==='back'?'１文字削除':k==='clear'?'入力を消す':k}">${k==='back'?'⌫':k==='clear'?'消す':k}</button>`).join('');document.querySelectorAll('[data-key]').forEach(e=>e.onclick=()=>edit(e.dataset.key));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideHint();settings(false);closeKeyboard();drawGraph();return}if(!state.active)return;if(/^\d$/.test(e.key)||['-','/','Backspace','Delete','Enter'].includes(e.key)){e.preventDefault();if(e.key==='Enter'){if(state.stage===2||state.mode==='read')check();else commit(Number(state.active[1]))}else edit(e.key==='-'?'minus':e.key==='/'?'fraction':e.key==='Backspace'?'back':e.key==='Delete'?'clear':e.key)}});
newQuestion();
let frame=0;
function fitLayout(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{const app=$('#app'),graph=$('.graph-box'),a=app.getBoundingClientRect(),g=graph.getBoundingClientRect();app.style.setProperty('--hint-space',Math.max(60,g.top-a.top-10)+'px');const available=(window.visualViewport?.height||innerHeight)-Math.max(0,a.top+scrollY)-(a.height-g.height)-6,h=Math.max(140,Math.min(g.width*300/310,available));if(Math.abs(g.height-h)>.5)graph.style.height=h+'px'})}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitLayout).observe($('#app'));window.addEventListener('resize',fitLayout);window.visualViewport?.addEventListener('resize',fitLayout);fitLayout();
if(document.modelContext?.registerTool){try{const controller=new AbortController();Promise.resolve(document.modelContext.registerTool({name:'new_system_graph_question',title:'連立方程式の新しい問題',description:'現在の設定で新しい問題を始めます。現在の解答は消えます。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||typeof input!=='object'||Array.isArray(input)||Object.keys(input).length)throw Error('No arguments expected');newQuestion();return{question:state.count,form:state.form,level:state.level,stage:state.stage}}},{signal:controller.signal})).catch(()=>{});window.addEventListener('pagehide',()=>controller.abort(),{once:true})}catch{}}
</script></body></html>
