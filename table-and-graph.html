<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f6fc"><title>表からグラフ</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#182744;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;border:0;border-radius:8px;min-height:40px;color:inherit;background:#e7edf8}button:focus-visible,input:focus-visible{outline:3px solid #e7b23f}button:disabled{opacity:.6}[hidden]{display:none!important}main{position:relative;max-width:470px;padding:10px 12px;margin:auto}header,.bar{display:flex;align-items:center;justify-content:space-between;gap:6px}header{height:37px}h1{font-size:19px;margin:0}.quiet{color:#2c52cc;background:transparent;font-size:12px;padding:3px 7px;min-height:28px}.steps{display:flex;justify-content:space-between;font-size:12px;color:#627189;margin:7px 0}.steps .current{color:#2c52cc;font-weight:700}.steps .done{color:#087c77}.question{display:flex;gap:6px;align-items:center;min-height:36px;font-size:12px}.question b{color:#2c52cc}.question #refresh{margin-left:auto;flex-shrink:0;border:1px solid #d1dbea;background:white}#tablePanel{padding:12px 9px;background:white;border:1px solid #dbe2ef;border-radius:12px;margin:8px 0}#tablePanel .bar{font-size:13px;margin-bottom:9px}#tableGuide{font-size:11px;color:#627189}table{width:100%;table-layout:fixed;border-collapse:collapse;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}td,th{border:1px solid #dbe2ef;height:46px;padding:2px}th{width:26px;background:#edf2fc;font-family:Georgia,serif;font-style:italic}td input{width:100%;height:38px;min-width:0;border:1px solid #bbccec;border-radius:6px;background:#f2f6ff;text-align:center;font-size:17px;color:#182744;padding:0}input.active{outline:2px solid #2c52cc;outline-offset:-2px}td.target{background:#fff0cf;box-shadow:inset 0 0 0 2px #d69819}td.placed{background:#e9f7f4}td button{min-height:35px;width:100%;background:transparent;font-size:inherit;padding:0}.status{font-size:10px;color:#087c77;display:block}#task{background:#edf2ff;border-radius:12px;padding:12px;font-size:14px;line-height:1.6}#task p{margin:0 0 9px}.choices{display:flex;gap:7px}.choices button{flex:1;background:white;border:1px solid #d2dcec;padding:5px;font-size:14px}.choices [aria-pressed=true]{background:#dfeaff;border:2px solid #2c52cc;color:#2447ba}.constant{display:flex;align-items:center;gap:8px;margin-top:10px}.constant input{height:43px;width:90px;min-width:0;border:1px solid #b9cae7;border-radius:8px;text-align:center;font-size:20px;background:white;color:#182744}.math{font-family:Georgia,serif;font-size:22px}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.15;margin:0 4px}.frac span:first-child{padding:0 5px 3px;border-bottom:1.4px solid}.frac span:last-child{padding:3px 5px 0}#keyboard{margin-top:8px}#keyboard .bar{font-size:12px;color:#627189}#minus{min-width:39px;font-size:24px}#inputLabel{margin-right:auto}#keys{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:5px}#keys button{background:white;border:1px solid #dbe2ef;min-height:37px;font-size:20px}#keys button:last-child{font-size:12px}#feedback{min-height:47px;font-size:13px;line-height:1.5;display:flex;align-items:center;padding:6px 0;color:#627189}#feedback.error{color:#b0342e}#feedback.success{color:#087c77;font-weight:bold}footer{display:flex;gap:6px}footer button{padding:6px 9px;font-size:13px}#hintButton{width:34px;flex-shrink:0;color:#2c52cc;font-size:20px}#reset{background:white;border:1px solid #cbd6e8}.primary{background:#2c52cc;color:white;flex:1;font-weight:bold}.note{font-size:11px;color:#627189;margin:10px 0}#settings,#hint{position:absolute;z-index:5;left:10px;right:10px;background:white;border:1px solid #aebfe7;border-radius:11px;padding:9px 11px;box-shadow:0 4px 20px #17305520}#settings{top:47px}#settings p{font-size:12px;line-height:1.6}#hint{top:4px;max-height:110px;overflow:auto}#hint .bar{font-size:12px}#hintText{font-size:13px;line-height:1.5;margin-top:4px}#graphPanel{height:330px;margin:0 -12px;background:white;border-block:1px solid #dbe2ef}#graph{width:100%;height:100%;display:block;touch-action:manipulation}main.plotting #tablePanel{margin:0 -12px 8px;border-radius:0;padding:6px 12px}main.plotting #tablePanel .bar{margin-bottom:5px}main.plotting td,main.plotting th{height:37px}main.plotting #task{padding:7px 10px;font-size:13px}main.plotting #task p{margin:0}main.plotting .note{display:none}@media(max-width:350px){td input,table{font-size:15px}.question{font-size:11px}#task{padding:10px}.choices button{font-size:13px}}
</style></head><body><main id="app"><header><h1>表からグラフ</h1><button id="settingsButton" class="quiet" aria-expanded="false">設定 ≫</button></header><section id="settings" hidden><div class="bar"><b>出題する関係</b><button id="closeSettings" class="quiet">閉じる</button></div><div class="choices"><button data-mode="direct" aria-pressed="true">比例のみ</button><button data-mode="inverse" aria-pressed="false">反比例のみ</button><button data-mode="mixed" aria-pressed="false">混合</button></div><p>正負の整数を使います。混合では、まず表から比例・反比例を見分けます。</p></section><div class="steps" id="steps"></div><div class="question"><b id="number"></b><span id="instruction"></span><button id="refresh" class="quiet">更新</button></div><section id="graphPanel" hidden><svg id="graph" viewBox="0 0 340 340" role="group" aria-label="座標平面"></svg></section><section id="tablePanel"><div class="bar"><b id="relationLabel"></b><span id="tableGuide"></span></div><div id="table"></div></section><section id="task"></section><section id="keyboard" hidden><div class="bar"><button id="minus" aria-label="選択中の数の符号を変える">−</button><span id="inputLabel"></span><button id="closeKeyboard" class="quiet">閉じる</button></div><div id="keys"></div></section><div id="feedback" role="status" aria-live="polite"></div><footer><button id="hintButton" aria-label="ヒントを表示" aria-expanded="false">?</button><button id="reset">やり直す</button><button id="check" class="primary">表を確かめる</button><button id="next" class="primary" hidden>次の問題</button></footer><p class="note">計算は紙で。表の数とグラフの点を結びつけよう。</p><aside id="hint" hidden><div class="bar"><b id="hintTitle"></b><button id="hintNext" class="quiet">次のヒント</button><button id="closeHint" class="quiet" aria-label="ヒントを閉じる">×</button></div><div id="hintText"></div></aside></main><script>'use strict';
const $=s=>document.querySelector(s),state={mode:'direct',q:null,phase:'table',values:{},active:null,kind:null,metric:null,points:{},target:0,pending:null,hint:0,count:0,mix:[]};
function makeQuestion(kind,a){const xs=kind==='direct'?[-3,-2,-1,0,1,2,3]:[-6,-5,-4,-3,-2,-1,1,2,3,4,5,6].filter(x=>a%x===0&&Math.abs(a/x)<=6);const ys=xs.map(x=>kind==='direct'?a*x:a/x);const holes=xs.map((x,i)=>i).filter(i=>i!==0&&i!==xs.length-1&&i!==xs.indexOf(1));return{kind,a,xs,ys,holes,known:[0,xs.indexOf(1)]}}
function newQuestion(){let kind=state.mode;if(kind==='mixed'){if(!state.mix.length)state.mix=Math.random()<.5?['direct','inverse']:['inverse','direct'];kind=state.mix.pop()}const options=kind==='direct'?[-2,-1,1,2]:[-6,-4,-2,2,4,6];let a=options[Math.floor(Math.random()*options.length)];if(state.q?.kind===kind&&state.q.a===a)a=options[(options.indexOf(a)+1)%options.length];state.q=makeQuestion(kind,a);state.count++;$('#number').textContent=String(state.count).padStart(2,'0');state.phase=state.mode==='mixed'?'identify':'table';reset()}
function feedback(t,c=''){$('#feedback').textContent=t;$('#feedback').className=c}
function closeInput(){state.active=null;$('#keyboard').hidden=true;document.querySelectorAll('input').forEach(e=>e.classList.remove('active'));fit()}
function hideHint(){state.hint=0;$('#hint').hidden=true;$('#hintButton').setAttribute('aria-expanded','false')}
function reset(){if(state.phase==='done')state.phase=state.mode==='mixed'?'identify':'table';state.values={};state.kind=null;state.metric=null;state.pending=null;if(['plot','table','identify'].includes(state.phase)){state.points={};state.target=0}hideHint();closeInput();render();feedback(state.phase==='plot'?'黄色の列の座標に点を打とう。':'計算は紙で。分かった値を入力しよう。')}
function tableReady(){return ['constant','plot','done'].includes(state.phase)}
function render(){const q=state.q,plot=['plot','done'].includes(state.phase);$('#app').classList.toggle('plotting',plot);$('#graphPanel').hidden=!plot;$('#relationLabel').textContent=state.phase==='identify'?'どちらの関係？':q.kind==='direct'?'比例':'反比例';$('#tableGuide').textContent=plot?`${Object.keys(state.points).length} / ${q.xs.length} 点`:'横１列が x、もう１列が y';
 const stages=state.mode==='mixed'?['identify','table','plot']:['table','constant','plot'],labels=state.mode==='mixed'?['① 関係','② 表','③ グラフ']:['① 表','② 一定の量','③ グラフ'];$('#steps').innerHTML=stages.map((p,i)=>`<span class="${p===state.phase?'current':stages.indexOf(state.phase)>i||state.phase==='done'?'done':''}">${labels[i]}</span>`).join('');
 $('#instruction').textContent={identify:'表の値から、関係を見分けよう。',table:'表の空欄を埋めよう。',constant:'何が一定になるか確かめよう。',plot:'表の座標に点を打とう。',done:'表とグラフがつながった！'}[state.phase];
 const cell=(i,axis)=>{const cls=plot?(state.points[i]?'placed':i===state.target?'target':''):'';let content=axis==='x'?q.xs[i]:q.ys[i];if(axis==='y'&&q.holes.includes(i)&&!tableReady())content=state.phase==='table'?`<input id="v${i}" readonly inputmode="none" aria-label="x が ${q.xs[i]} のときの y" placeholder="?" value="${state.values['v'+i]||''}">`:'?';if(plot&&axis==='x')content=`<button data-column="${i}" aria-label="x が ${q.xs[i]} の点を選ぶ">${content}</button>`;return `<td class="${cls}">${content}</td>`};
 $('#table').innerHTML=`<table aria-label="x と y の表"><tbody><tr><th scope="row">x</th>${q.xs.map((_,i)=>cell(i,'x')).join('')}</tr><tr><th scope="row">y</th>${q.xs.map((_,i)=>cell(i,'y')).join('')}</tr></tbody></table>`;
 let task='';if(state.phase==='table')task=`<p>${q.kind==='direct'?'x が２倍・３倍になると、y も２倍・３倍。':'x が２倍・３倍になると、y は半分・３分の１。'}</p>空欄をタップして入力しよう。`;
 if(['constant','identify'].includes(state.phase)){const known=q.known;task=(state.phase==='identify'?'<p>既に分かっている値を比べよう。</p><div class="choices"><button data-kind="direct">比例</button><button data-kind="inverse">反比例</button></div>':`<p>(${q.xs[known[0]]}, ${q.ys[known[0]]}) と (${q.xs[known[1]]}, ${q.ys[known[1]]}) を紙で計算。<br>どちらが同じ値になる？</p>`)+`<div class="choices metric"><button data-metric="ratio"><span class="frac"><span>y</span><span>x</span></span>（y ÷ x）</button><button data-metric="product">x × y</button></div><div class="constant"><label for="a">一定の値は</label><input id="a" readonly inputmode="none" aria-label="一定の値" placeholder="?" value="${state.values.a||''}"></div>`}
 if(state.phase==='plot')task=`<p>${Object.keys(state.points).length===q.xs.length?'すべての点を打てました。グラフの形を見てみよう。':`黄色の列の点をタップ。正解なら次の列へ進みます。列を押すと選び直せます。`}</p>`;
 if(state.phase==='done')task=q.kind==='direct'?`<p><b>点は原点を通る一直線に並びます。</b><br><span class="math">y = ${q.a===1?'':q.a===-1?'−':q.a}x</span>　x ≠ 0 のとき y ÷ x = ${q.a}</p>`:`<p><b>点は２つに分かれた滑らかな曲線に並びます。</b><br><span class="math">y = <span class="frac"><span>${q.a}</span><span>x</span></span></span>　xy = ${q.a}<br>x = 0 のときの y は定まりません。曲線は軸に触れず、原点でもつながりません。</p>`;
 $('#task').innerHTML=task;document.querySelectorAll('input').forEach(e=>{e.onclick=()=>activate(e.id);e.onfocus=()=>activate(e.id)});document.querySelectorAll('[data-kind]').forEach(e=>{e.setAttribute('aria-pressed',String(state.kind===e.dataset.kind));e.onclick=()=>{state.kind=e.dataset.kind;closeInput();render()}});document.querySelectorAll('[data-metric]').forEach(e=>{e.setAttribute('aria-pressed',String(state.metric===e.dataset.metric));e.onclick=()=>{state.metric=e.dataset.metric;closeInput();render()}});document.querySelectorAll('[data-column]').forEach(e=>e.onclick=()=>{if(state.phase==='done')return;state.target=Number(e.dataset.column);delete state.points[state.target];state.pending=null;hideHint();render();feedback('選んだ列の点を置こう。')});
 $('#check').hidden=state.phase==='done'||(state.phase==='plot'&&Object.keys(state.points).length<q.xs.length);$('#next').hidden=state.phase!=='done';$('#check').textContent=state.phase==='table'?'表を確かめる':state.phase==='plot'?(Object.keys(state.points).length===q.xs.length?'グラフを見る':'点を確かめる'):'答えを確かめる';if(plot)draw();fit()}
function activate(id){state.active=id;$('#keyboard').hidden=false;$('#inputLabel').textContent=id==='a'?'一定の値':`x = ${state.q.xs[Number(id.slice(1))]} のときの y`;document.querySelectorAll('input').forEach(e=>e.classList.toggle('active',e.id===id));fit()}
function edit(k){if(!state.active)return;const id=state.active;let v=state.values[id]||'';if(k==='minus')v=v.startsWith('-')?v.slice(1):'-'+v;else if(k==='back')v=v.slice(0,-1);else if(k==='clear')v='';else if(/^\d$/.test(k)&&v.replace('-','').length<3)v+=k;state.values[id]=v;$('#'+id).value=v}
function value(id){const s=state.values[id]||'';return /^-?\d+$/.test(s)?Number(s):null}
function advance(p,text){state.phase=p;state.pending=null;hideHint();closeInput();render();feedback(text,'success')}
function check(){closeInput();const q=state.q;if(state.phase==='table'){if(q.holes.some(i=>value('v'+i)===null)){feedback('空欄をすべて埋めよう。','error');return}const bad=q.holes.find(i=>value('v'+i)!==q.ys[i]);if(bad!==undefined){feedback(`x = ${q.xs[bad]} のときの y をもう一度考えよう。`,'error');return}advance(state.mode==='mixed'?'plot':'constant','表は正解！ '+(state.mode==='mixed'?'次は点を打とう。':'何が一定か確かめよう。'));return}
 if(['constant','identify'].includes(state.phase)){if(state.phase==='identify'&&state.kind!==q.kind){feedback(state.kind?'比例と反比例、どちらの関係になるか確かめよう。':'比例か反比例かを選ぼう。','error');return}if(state.metric!==(q.kind==='direct'?'ratio':'product')){feedback('何を計算すると一定になるか、２組の値で比べよう。','error');return}if(value('a')!==q.a){feedback('一定の値を、符号も含めて確かめよう。','error');return}advance(state.phase==='identify'?'table':'plot',`正解！ ${q.kind==='direct'?'y ÷ x':'x × y'} は ${q.a} で一定です。`);return}
 if(state.phase==='plot'){if(Object.keys(state.points).length===q.xs.length){advance('done','点の並び方を確かめよう。');return}const p=state.pending,i=state.target;if(!p){feedback('まず黄色の列の座標に点を打とう。','error');return}if(p[0]!==q.xs[i]||p[1]!==q.ys[i]){feedback('横が x、縦が y。黄色の列と見比べよう。','error');return}state.points[i]=p;state.pending=null;const next=q.xs.findIndex((_,j)=>!state.points[j]);if(next>=0)state.target=next;hideHint();render();feedback(next<0?'全点正解！ 「グラフを見る」を押そう。':'正解！ 次の黄色の列の点を打とう。','success')}}
const px=x=>170+23*x,py=y=>170-23*y;
function draw(){let s='<defs><clipPath id="clip"><rect x="32" y="32" width="276" height="276"/></clipPath></defs>';for(let i=-6;i<=6;i++){s+=`<path d="M${px(i)} 32V308 M32 ${py(i)}H308" stroke="#e2e9f3"/>`;if(i)s+=`<text x="${px(i)}" y="185" text-anchor="middle">${i}</text><text x="161" y="${py(i)+3}" text-anchor="end">${i}</text>`}s='<g font-size="10" fill="#667891">'+s+'</g><path d="M24 170H322m-6-4 6 4-6 4 M170 316V20m-4 6 4-6 4 6" fill="none" stroke="#73839c" stroke-width="1.4"/><text x="326" y="174">x</text><text x="178" y="23">y</text><text x="158" y="185" font-size="10">0</text>';
 if(state.phase==='done'){const q=state.q;if(q.kind==='direct')s+=`<path d="M${px(-6)} ${py(-6*q.a)}L${px(6)} ${py(6*q.a)}" stroke="#2c52cc" stroke-width="2.5" clip-path="url(#clip)"/>`;else for(const sign of [-1,1]){let d='';for(let i=1;i<=600;i++){const x=sign*i/100,y=q.a/x;d+=(i===1?'M':'L')+px(x)+' '+py(y)}s+=`<path d="${d}" fill="none" stroke="#2c52cc" stroke-width="2.5" clip-path="url(#clip)"/>`}}
 if(state.hint>=2&&state.phase==='plot'){const i=state.target,x=state.q.xs[i],y=state.q.ys[i];s+=`<path d="M170 170H${px(x)}${state.hint>=3?'V'+py(y):''}" fill="none" stroke="#078b80" stroke-width="2" stroke-dasharray="5 3"/>`}
 for(const p of Object.values(state.points))s+=`<circle cx="${px(p[0])}" cy="${py(p[1])}" r="4" fill="#2c52cc" stroke="white" stroke-width="1.5"/>`;if(state.pending)s+=`<circle cx="${px(state.pending[0])}" cy="${py(state.pending[1])}" r="6" fill="#f6b942" stroke="#966700" stroke-width="1.5"/>`;$('#graph').innerHTML=s}
$('#graph').onclick=e=>{if(state.phase!=='plot'||Object.keys(state.points).length===state.q.xs.length)return;const svg=$('#graph'),m=svg.getScreenCTM();if(!m)return;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const v=p.matrixTransform(m.inverse());if(v.x<25||v.x>315||v.y<25||v.y>315)return;state.pending=[Math.max(-6,Math.min(6,Math.round((v.x-170)/23))),Math.max(-6,Math.min(6,Math.round((170-v.y)/23)))];draw();check()};
function showHint(){state.hint=Math.min(3,state.hint+1);$('#hint').hidden=false;$('#hintButton').setAttribute('aria-expanded','true');$('#hintTitle').textContent=`ヒント ${state.hint}/3`;$('#hintNext').hidden=state.hint===3;const q=state.q,n=state.hint;let t;if(state.phase==='plot'){const i=state.target;t=n===1?'横が x、縦が y。黄色の列を見よう。':n===2?`原点から横に x = ${q.xs[i]} の位置へ。`:`そこから縦に y = ${q.ys[i]} の位置へ。補助線をたどろう。`;draw()}else if(state.phase==='done')t=q.kind==='direct'?'比例のグラフは、原点を通る直線です。':'反比例のグラフは２つの曲線。点と点を折れ線で結ばず、滑らかにつなぎます。';else{const i=q.known[0],x=q.xs[i],y=q.ys[i];t=n===1?'既に分かっている２組の x、y を比べよう。':n===2?(q.kind==='direct'?'比例では y ÷ x が一定。x = 0 の列では割れないので、別の列を使おう。':'反比例では x × y が一定。積を計算してみよう。'):`(${x}, ${y}) では ${q.kind==='direct'?`${y} ÷ (${x})`:`(${x}) × (${y})`} = ${q.a}。${state.phase==='table'?(q.kind==='direct'?'この値に x をかけると y。':'この値を x で割ると y。'):'もう１組でも同じになるかな？'}`}$('#hintText').textContent=t}
function settings(open){$('#settings').hidden=!open;$('#settingsButton').setAttribute('aria-expanded',String(open));if(open){hideHint();if(state.phase==='plot')draw()}}
$('#settingsButton').onclick=()=>settings($('#settings').hidden);$('#closeSettings').onclick=()=>settings(false);document.querySelectorAll('[data-mode]').forEach(e=>e.onclick=()=>{state.mode=e.dataset.mode;state.mix=[];document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===e)));settings(false);newQuestion()});$('#refresh').onclick=newQuestion;$('#reset').onclick=reset;$('#next').onclick=newQuestion;$('#check').onclick=check;$('#hintButton').onclick=showHint;$('#hintNext').onclick=showHint;$('#closeHint').onclick=()=>{hideHint();if(state.phase==='plot')draw()};$('#minus').onclick=()=>edit('minus');$('#closeKeyboard').onclick=closeInput;
$('#keys').innerHTML=['1','2','3','4','5','back','6','7','8','9','0','clear'].map(k=>`<button data-key="${k}" aria-label="${k==='back'?'１文字削除':k==='clear'?'入力を消す':k}">${k==='back'?'⌫':k==='clear'?'消す':k}</button>`).join('');document.querySelectorAll('[data-key]').forEach(e=>e.onclick=()=>edit(e.dataset.key));document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeInput();hideHint();settings(false);if(state.phase==='plot')draw();return}if(!state.active)return;if(e.key==='Enter'){e.preventDefault();check()}else if(/^\d$/.test(e.key)||['-','Backspace','Delete'].includes(e.key)){e.preventDefault();edit(e.key==='-'?'minus':e.key==='Backspace'?'back':e.key==='Delete'?'clear':e.key)}});
let frame=0;function fit(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{if($('#graphPanel').hidden)return;const app=$('#app').getBoundingClientRect(),g=$('#graphPanel'),r=g.getBoundingClientRect();const h=Math.max(150,Math.min(r.width,(window.visualViewport?.height||window.innerHeight)-(app.height-r.height)-12));if(Math.abs(r.height-h)>.5)g.style.height=h+'px'})}window.addEventListener('resize',fit);window.visualViewport?.addEventListener('resize',fit);newQuestion();
</script></body></html>
